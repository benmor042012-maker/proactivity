'est ni un test ni un diagnostic. C'est un instantané, et il change dès que tu passes à l'action.","dim.init":"Initiative","dim.goal":"Objectifs","dim.time":"Gestion du temps","dim.solve":"Face aux problèmes","dim.plan":"Anticipation","qz.1.q":"Tu as un contrôle dans une semaine. Il se passe quoi, en général ?","qz.1.a":"Je commence à réviser quelques jours avant","qz.1.b":"Je me dis qu'il reste plein de temps","qz.1.c":"Je m'en souviens la veille au soir","qz.1.d":"Ça dépend de l'importance de la matière","qz.2.q":"On cherche un volontaire pour un projet en classe. Tu fais quoi ?","qz.2.a":"Je lève la main","qz.2.b":"J'attends de voir qui se propose","qz.2.c":"J'espère qu'on ne me choisira pas","qz.2.d":"Ça dépend si le sujet m'intéresse","qz.3.q":"Il y a un truc que tu veux réussir. Ça ressemble à quoi, là ?","qz.3.a":"Écrit quelque part, avec une date","qz.3.b":"Je sais à peu près quoi et quand","qz.3.c":"C'est seulement dans ma tête","qz.3.d":"Je n'ai rien de clair en ce moment","qz.4.q":"Ton sac et ta chambre — c'est comment ?","qz.4.a":"Rangé, je sais où est chaque chose","qz.4.b":"Correct. Parfois ça part en vrille","qz.4.c":"Le bazar, mais je m'y retrouve","qz.4.d":"Je cherche mes affaires chaque matin","qz.5.q":"Quelque chose ne marche pas. C'est quoi ton premier réflexe ?","qz.5.a":"J'essaie seul, et sinon je demande","qz.5.b":"Je demande tout de suite","qz.5.c":"Je laisse ça pour \"plus tard\"","qz.5.d":"Je bloque et ça m'énerve","qz.6.q":"Les trucs à faire à la maison — ça se passe comment ?","qz.6.a":"Je les fais de moi-même","qz.6.b":"Un rappel et c'est réglé","qz.6.c":"Il faut me le rappeler plusieurs fois","qz.6.d":"En général quelqu'un d'autre le fait","qz.7.q":"La dernière fois que tu as commencé un truc quotidien — ça a duré combien ?","qz.7.a":"Un mois ou plus, je le fais encore","qz.7.b":"Quelques semaines","qz.7.c":"Quelques jours","qz.7.d":"Un ou deux jours et c'est parti","qz.8.q":"Demain matin. Tu sais comment la journée va se passer ?","qz.8.a":"J'ai un plan clair en tête","qz.8.b":"En gros oui, sans les détails","qz.8.c":"Je découvre au fur et à mesure","qz.8.d":"Je ne pense pas vraiment à demain","qz.9.q":"Tu as raté un truc dans lequel tu t'étais investi. Tu en es où deux jours après ?","qz.9.a":"Je réessaie déjà, autrement","qz.9.b":"Je réessaie exactement pareil","qz.9.c":"Je fais une longue pause","qz.9.d":"En général je n'y reviens pas","qz.10.q":"Une tâche que tu détestes. Tu la commences quand ?","qz.10.a":"En premier, pour en finir","qz.10.b":"Je me fixe une heure et je m'y mets","qz.10.c":"Je repousse jusqu'au dernier moment","qz.10.d":"Parfois elle ne se fait jamais","rs.t":"Ton profil","rs.s":"C'est où tu en es aujourd'hui. Pas où tu resteras.","rs.index":"Indice de proactivité","rs.mean":"Ça veut dire quoi ?","rs.try":"À essayer maintenant","rs.strong":"Ton point fort","rs.grow":"De la marge","rs.cta":"Allez, on commence","rs.again":"Refaire le test","rs.updated":"Profil mis à jour","rs.none":"Tu n'as pas encore fait le point. Ça prend une minute.","rs.b1":"Au début","rs.b2":"En train de lancer","rs.b3":"Aux commandes","rs.b4":"Tu te diriges","rs.st.init":"quand un truc compte pour toi, tu n'attends pas qu'on te le dise — tu bouges","rs.st.goal":"tu sais où tu veux aller, et c'est déjà la moitié du travail","rs.st.time":"tu sais démarrer à temps au lieu de courir à la fin","rs.st.solve":"quand ça coince, tu cherches une solution au lieu de rester bloqué","rs.st.plan":"tu anticipes, donc moins de choses te prennent au dépourvu","rs.gr.init":"parfois tu attends que quelqu'un d'autre bouge en premier","rs.gr.goal":"ce que tu veux reste dans ta tête et n'est écrit nulle part","rs.gr.time":"ce qui ne semble pas urgent passe à la trappe","rs.gr.solve":"quand ça ne marche pas, laisser tomber paraît plus simple que réessayer autrement","rs.gr.plan":"la journée commence avant que tu saches quel est le plan","rs.line":"On dirait que {strong}, mais {grow}. C'est cet écart qu'il vaut le coup de travailler maintenant.","rs.ac.init.1":"Choisis une chose cette semaine que tu fais sans qu'on te le demande","rs.ac.init.2":"La prochaine fois qu'on cherche un volontaire — compte 3 secondes et lève la main","rs.ac.init.3":"Envoie un message que tu repousses — à un ami, un prof, qui que ce soit","rs.ac.goal.1":"Écris un objectif en une phrase, avec une date","rs.ac.goal.2":"Découpe-le en une étape faisable aujourd'hui","rs.ac.goal.3":"En fin de semaine, relis-le et ajuste ce qu'il faut","rs.ac.time.1":"Prends la tâche que tu repousses le plus et fais-en 5 minutes. Juste 5","rs.ac.time.2":"Donne à une tâche une heure fixe dans ta journée","rs.ac.time.3":"Commence par la tâche la moins agréable — c'est comme ça qu'elle finit le plus vite","rs.ac.solve.1":"La prochaine fois que tu bloques, donne-toi 10 minutes seul avant d'abandonner","rs.ac.solve.2":"Écris précisément ce qui coince. Souvent c'est déjà la moitié de la solution","rs.ac.solve.3":"Un truc qui a raté — réessaie avec un petit changement","rs.ac.plan.1":"Le soir, écris trois choses pour demain. Pas plus","rs.ac.plan.2":"Prépare ton sac le soir plutôt que le matin","rs.ac.plan.3":"Choisis un jour fixe par semaine pour regarder la semaine à venir","ls.t":"Apprendre à être proactif","ls.s":"Des lectures courtes. Moins d'une minute chacune, et ça finit par un truc à faire maintenant.","ls.ex":"Dans la vraie vie","ls.do":"Fais ça maintenant","ls.read":"30 secondes","ls.read2":"1 minute","ls.mk":"Marquer comme lu","ls.done":"Lu","ls.1.t":"C'est quoi, proactif ?","ls.1.b":"Être proactif, ce n'est pas être occupé toute la journée. C'est remarquer que tu as le choix — et en faire quelque chose, au lieu d'attendre qu'on décide pour toi.","ls.1.e":"La prof a dit qu'il y aurait un contrôle « bientôt ». Réflexe habituel : attendre la date. Réflexe proactif : demander quand, et ouvrir le cours aujourd'hui.","ls.1.d":"Pense à une chose que tu attends en ce moment. Quel pas peux-tu faire sans attendre ?","ls.2.t":"Proactif ou réactif","ls.2.b":"Réactif = la vie t'arrive dessus et tu réagis. Proactif = tu décides d'abord, puis tu agis. Les deux font à peu près les mêmes choses — dans l'ordre inverse.","ls.2.e":"Ton téléphone est plein pile quand tu dois filmer. Réactif : tu supprimes en panique. Proactif : tu avais fait de la place la semaine d'avant.","ls.2.d":"Trouve un truc qui va te retomber dessus dans une semaine. Donne-lui cinq minutes aujourd'hui.","ls.3.t":"Arrêter d'attendre la motivation","ls.3.b":"La motivation n'arrive presque jamais avant l'action. Elle arrive après. Tu n'as pas besoin d'attendre l'envie — commence petit, et l'envie suit.","ls.3.e":"Personne n'a envie de courir sous la pluie. Mais deux minutes après le départ, tu n'as plus envie de t'arrêter.","ls.3.d":"Choisis une tâche. Fais-en deux minutes sans te demander si tu en as envie.","ls.4.t":"Démarrer sans énergie","ls.4.b":"Quand tu n'as plus d'énergie, le problème est presque toujours la taille de la tâche, pas ton énergie. Réduis-la jusqu'à ce qu'elle paraisse ridicule : pas « ranger ma chambre » mais « ramasser cinq trucs par terre ».","ls.4.e":"Des devoirs qui ressemblent à deux heures. Ouvre juste le cahier et écris la date. En général tu ne t'arrêtes pas là.","ls.4.d":"Prends une grosse tâche repoussée et écris sa plus petite version. Puis fais-la.","ls.5.t":"Gérer la procrastination","ls.5.b":"La procrastination, c'est presque toujours fuir une émotion, pas de la paresse : peur d'échouer, ennui, ou juste ne pas savoir par où commencer. Dès que la première étape est petite et claire, il n'y a plus rien à fuir.","ls.5.e":"Un devoir à rendre. Tu l'évites une semaine — pas parce que c'est dur, mais parce que tu ne sais pas par où commencer.","ls.5.d":"Écris la tâche que tu évites le plus, puis à côté la toute première ligne que tu pourrais y écrire.","ls.6.t":"Fixer un objectif qui se réalise","ls.6.b":"Un bon objectif répond à trois questions : quoi exactement, pour quand, et quelle est la première étape. « Progresser au basket » n'est pas un objectif. « Tirer 50 lancers francs trois fois par semaine jusqu'à la fin du mois », si.","ls.6.e":"« Je veux me remettre en forme » traîne un an. « Courir 20 minutes mardi et jeudi » commence mardi.","ls.6.d":"Prends un objectif que tu as en tête et ajoute-lui un chiffre et une date.","ls.7.t":"Transformer un objectif en habitude","ls.7.b":"Une habitude se crée quand l'action a une place fixe — même heure, même endroit, juste après la même chose. Tu n'as plus à décider chaque jour, et c'est ça qui économise l'énergie.","ls.7.e":"« Je lirai quand j'aurai le temps » n'arrive jamais. « Je lis dix minutes après m'être brossé les dents » se fait presque tout seul.","ls.7.d":"Choisis une action et accroche-la à un truc que tu fais déjà chaque jour.","ls.8.t":"Quand ça ne marche pas","ls.8.b":"Échouer, c'est une info, pas un verdict. La seule question qui vaut : « qu'est-ce qui n'a pas marché, exactement ? » — parce qu'elle a une réponse, contrairement à « pourquoi je suis comme ça ».","ls.8.e":"Tu as raté un contrôle. « Je suis nul en maths » n'aide pas. « J'ai révisé la veille et seulement la dernière page » — ça, tu peux le changer.","ls.8.d":"Pense à un truc récemment raté et écris une phrase : ce que tu feras autrement.","ac.t":"Réussites","ac.s":"Ils se débloquent en avançant. Rien à perdre ici.","ac.got":"{n} sur {t} débloquées","ac.locked":"Pas encore","ac.new":"Nouvelle réussite : {x}","ac.1.t":"Premier pas","ac.1.d":"Tu as bouclé une tâche","ac.2.t":"Trois jours d'affilée","ac.2.d":"Tu es revenu trois jours de suite","ac.3.t":"Premier objectif","ac.3.d":"Tu as fixé ton propre objectif","ac.4.t":"Tu as pris l'initiative","ac.4.d":"Tu as relevé un défi du jour","ac.5.t":"Tu as anticipé","ac.5.d":"Tu as atteint un objectif hebdo","ac.6.t":"Tu n'as pas lâché","ac.6.d":"Tu es revenu après une série cassée","ac.7.t":"Curieux","ac.7.d":"Tu as lu trois leçons","ac.8.t":"Tu te connais","ac.8.d":"Tu as fait le point","ac.9.t":"Une semaine entière","ac.9.d":"Sept jours de suite","ac.10.t":"Dix tâches","ac.10.d":"Tu as bouclé dix tâches","n.hero.a":"Plus d'initiative.","n.hero.b":"Moins d'attente.","n.hero.sub":"Proactivity t'aide à transformer ce que tu veux faire en actions réelles — une étape à la fois.","n.hero.cta":"On commence","n.hero.cta2":"C'est quoi être proactif ?","n.hero.note":"Sans inscription · Sans e-mail · Tout reste sur ton appareil","n.hero.kicker":"Pour les 13–18 ans","n.def.t":"Alors, c'est quoi ?","n.def.b":"Être proactif, ce n'est pas attendre qu'on te rappelle, qu'on te mette la pression ou qu'on décide pour toi. C'est voir ce que tu peux faire — et le faire.","n.def.re":"Réactif","n.def.pro":"Proactif","n.def.hint":"Exactement les mêmes situations. Deux réactions différentes.","n.sc.1.t":"Un contrôle dans une semaine","n.sc.1.r":"« J'ai plein de temps. »","n.sc.1.p":"« 20 minutes aujourd'hui, et pas de panique à la fin. »","n.sc.2.t":"Entraînement","n.sc.2.r":"« J'irai quand j'aurai envie. »","n.sc.2.p":"« Mardi et jeudi à six heures. C'est décidé. »","n.sc.3.t":"Un projet scolaire","n.sc.3.r":"« J'attends de voir ce que font les autres. »","n.sc.3.p":"« J'écris le sujet et je répartis les parties aujourd'hui. »","n.sc.4.t":"Apprendre un truc nouveau","n.sc.4.r":"« Je m'y mettrai un jour. »","n.sc.4.p":"« Une vidéo aujourd'hui, puis 10 minutes de pratique. »","n.sc.5.t":"Ranger ta chambre","n.sc.5.r":"« Je le ferai quand on me le dira. »","n.sc.5.p":"« Cinq minutes maintenant, et personne n'a à demander. »","n.sc.6.t":"Se lancer dans un hobby","n.sc.6.r":"« Je n'ai pas le temps pour ça. »","n.sc.6.p":"« Une demi-heure samedi. On verra si ça me parle. »","n.sc.7.t":"Parler à quelqu'un","n.sc.7.r":"« Peut-être qu'il m'écrira en premier. »","n.sc.7.p":"« J'écris le message maintenant et je l'envoie. »","n.sc.8.t":"Un objectif perso","n.sc.8.r":"« Un jour ça arrivera. »","n.sc.8.p":"« Je l'ai écrit, daté, commencé. »","n.def.close":"Personne n'est proactif sur tout. Ce n'est pa ":"Первой, чтобы покончить с ней","qz.10.b":"Назначаю себе время и начинаю","qz.10.c":"Откладываю до последнего","qz.10.d":"Иногда она просто не случается","rs.t":"Твой профиль","rs.s":"Это то, где ты сегодня. А не то, где ты останешься.","rs.index":"Индекс проактивности","rs.mean":"Что это значит?","rs.try":"Что стоит попробовать","rs.strong":"Твоя сильная сторона","rs.grow":"Есть куда расти","rs.cta":"Отлично, начнём","rs.again":"Пройти заново","rs.updated":"Профиль обновлён","rs.none":"Ты ещё не проходил чек-ин. Это займёт минуту.","rs.b1":"В самом начале","rs.b2":"Набираешь ход","rs.b3":"В управлении","rs.b4":"Ведёшь себя сам","rs.st.init":"когда что-то для тебя важно, ты не ждёшь указаний — ты действуешь","rs.st.goal":"ты знаешь, куда хочешь прийти, а это уже половина дела","rs.st.time":"ты умеешь начинать вовремя, а не бежать в конце","rs.st.solve":"когда что-то застревает, ты ищешь выход, а не зависаешь","rs.st.plan":"ты думаешь наперёд, поэтому меньше вещей застаёт тебя врасплох","rs.gr.init":"иногда ты ждёшь, пока первым сдвинется кто-то другой","rs.gr.goal":"то, чего ты хочешь, всё ещё в голове и нигде не записано","rs.gr.time":"то, что не кажется срочным, отодвигается в сторону","rs.gr.solve":"когда что-то не выходит, бросить кажется проще, чем попробовать иначе","rs.gr.plan":"день начинается раньше, чем ты понимаешь, каков план","rs.line":"Похоже, {strong}, но {grow}. Именно этот разрыв сейчас имеет смысл закрывать.","rs.ac.init.1":"Выбери одно дело на этой неделе, которое сделаешь без просьбы","rs.ac.init.2":"В следующий раз, когда ищут добровольца — дай себе 3 секунды и подними руку","rs.ac.init.3":"Отправь одно сообщение, которое откладывал — другу, учителю, кому угодно","rs.ac.goal.1":"Запиши одну цель в одном предложении, со сроком","rs.ac.goal.2":"Разбей её на один шаг, который можно сделать сегодня","rs.ac.goal.3":"В конце недели посмотри на неё снова и поменяй, что нужно","rs.ac.time.1":"Возьми задачу, которую откладывал дольше всего, и сделай 5 минут. Только 5","rs.ac.time.2":"Назначь одной задаче постоянное время в дне","rs.ac.time.3":"Начни с самой неприятной задачи — так она закончится быстрее всего","rs.ac.solve.1":"В следующий раз, когда застрянешь, дай себе 10 минут наедине, прежде чем бросить","rs.ac.solve.2":"Запиши, что именно не работает. Часто это уже половина решения","rs.ac.solve.3":"То, что не вышло — попробуй снова с одним небольшим изменением","rs.ac.plan.1":"Вечером запиши три дела на завтра. Не больше","rs.ac.plan.2":"Собери рюкзак вечером, а не утром","rs.ac.plan.3":"Выбери один постоянный день в неделю, чтобы посмотреть на следующую","ls.t":"Учимся быть проактивным","ls.s":"Короткие тексты. Каждый меньше минуты и заканчивается одним делом на сейчас.","ls.ex":"В реальной жизни","ls.do":"Сделай это сейчас","ls.read":"30 секунд","ls.read2":"1 минута","ls.mk":"Отметить прочитанным","ls.done":"Прочитано","ls.1.t":"Что такое проактивность?","ls.1.b":"Быть проактивным — не значит быть занятым весь день. Это заметить, что у тебя есть выбор, и что-то с ним сделать, вместо того чтобы ждать, пока решат за тебя.","ls.1.e":"Учитель сказал, что скоро контрольная. Обычная реакция — ждать даты. Проактивная — спросить когда и открыть материал сегодня.","ls.1.d":"Подумай об одном деле, которого ты сейчас ждёшь. Какой шаг ты можешь сделать, не дожидаясь?","ls.2.t":"Проактивный или реактивный","ls.2.b":"Реактивный — жизнь случается с тобой, и ты реагируешь. Проактивный — ты сначала решаешь, потом действуешь. Оба делают примерно одно и то же, только в обратном порядке.","ls.2.e":"Память в телефоне кончилась ровно тогда, когда надо снимать. Реактивно — удалять в панике. Проактивно — освободил место на прошлой неделе.","ls.2.d":"Найди одно дело, которое рванёт через неделю. Дай ему пять минут сегодня.","ls.3.t":"Как перестать ждать мотивацию","ls.3.b":"Мотивация почти никогда не приходит до действия. Она приходит после. Не нужно ждать желания — начни с малого, и желание догонит.","ls.3.e":"Никто не хочет бежать под дождём. Но через две минуты бега остановиться уже не хочется.","ls.3.d":"Выбери задачу. Сделай две минуты, не спрашивая, хочется ли.","ls.4.t":"Как начать без сил","ls.4.b":"Когда нет сил, проблема почти всегда в размере задачи, а не в твоих силах. Уменьши её до смешного: не «убрать комнату», а «поднять пять вещей с пола».","ls.4.e":"Домашка, которая выглядит на два часа. Просто открой тетрадь и напиши дату. Обычно на этом ты не остановишься.","ls.4.d":"Возьми большую отложенную задачу и запиши её минимальную версию. И сделай именно её.","ls.5.t":"Что делать с прокрастинацией","ls.5.b":"Прокрастинация — почти всегда бегство от чувства, а не лень: страх провала, скука или просто непонятно, с чего начать. Как только первый шаг мал и ясен, бежать не от чего.","ls.5.e":"Работа, которую надо сдать. Ты избегаешь её неделю — не потому что сложно, а потому что непонятно, с чего начать.","ls.5.d":"Запиши задачу, которую избегаешь больше всего, а рядом — самую первую строчку, которую в ней можно написать.","ls.6.t":"Как поставить цель, которая случится","ls.6.b":"Хорошая цель отвечает на три вопроса: что именно, к какому сроку и какой первый шаг. «Стать лучше в баскетболе» — не цель. «Бросать 50 штрафных три раза в неделю до конца месяца» — цель.","ls.6.e":"«Хочу быть в форме» висит в воздухе год. «Бегать 20 минут во вторник и четверг» начинается во вторник.","ls.6.d":"Возьми цель, что у тебя в голове, и добавь к ней число и дату.","ls.7.t":"Как цель становится привычкой","ls.7.b":"Привычка складывается, когда у действия есть постоянное место — то же время, то же место, сразу после того же события. Не нужно решать заново каждый день — именно это и экономит силы.","ls.7.e":"«Почитаю, когда будет время» не случается. «Читаю десять минут сразу после чистки зубов» работает почти само.","ls.7.d":"Выбери одно действие и привяжи его к тому, что ты и так делаешь каждый день.","ls.8.t":"Когда что-то не получается","ls.8.b":"Провал — это информация, а не приговор. Единственный стоящий вопрос: «что именно не сработало?» — на него есть ответ, а на «почему я такой» — нет.","ls.8.e":"Ты завалил контрольную. «Я плох в математике» не помогает. «Я готовился только накануне и только по последней странице» — вот это можно изменить.","ls.8.d":"Вспомни то, что недавно не вышло, и напиши одно предложение: что сделаешь иначе.","ac.t":"Достижения","ac.s":"Открываются по ходу. Здесь нечего терять.","ac.got":"Открыто {n} из {t}","ac.locked":"Пока нет","ac.new":"Новое достижение: {x}","ac.1.t":"Первый шаг","ac.1.d":"Ты закрыл одну задачу","ac.2.t":"Три дня подряд","ac.2.d":"Ты возвращался три дня подряд","ac.3.t":"Первая цель","ac.3.d":"Ты поставил свою цель","ac.4.t":"Ты проявил инициативу","ac.4.d":"Ты закрыл вызов дня","ac.5.t":"Ты спланировал заранее","ac.5.d":"Ты закрыл недельную цель","ac.6.t":"Ты не сдался","ac.6.d":"Ты вернулся после сорванной серии","ac.7.t":"Любознательный","ac.7.d":"Ты прочитал три урока","ac.8.t":"Знаешь себя","ac.8.d":"Ты прошёл чек-ин","ac.9.t":"Целая неделя","ac.9.d":"Семь дней подряд","ac.10.t":"Десять задач","ac.10.d":"Ты закрыл десять задач","n.hero.a":"Больше инициативы.","n.hero.b":"Меньше ожидания.","n.hero.sub":"Proactivity помогает превратить то, что ты хочешь сделать, в реальные действия — по шагу за раз.","n.hero.cta":"Начнём","n.hero.cta2":"А что вообще такое проактивность?","n.hero.note":"Без регистрации · Без почты · Всё остаётся на твоём устройстве","n.hero.kicker":"Для 13–18 лет","n.def.t":"Так что это, если по-простому?","n.def.b":"Проактивность — это не ждать, пока напомнят, надавят или решат за тебя. Это заметить, что ты можешь сделать, — и сделать.","n.def.re":"Реактивно","n.def.pro":"Проактивно","n.def.hint":"Ровно те же ситуации. Две разные реакции.","n.sc.1.t":"Контрольная через неделю","n.sc.1.r":"«Времени ещё полно.»","n.sc.1.p":"«20 минут сегодня — и не паникую в конце.»","n.sc.2.t":"Тренировка","n.sc.2.r":"«Пойду, когда захочется.»","n.sc.2.p":"«Вторник и четверг в шесть. Уже решено.»","n.sc.3.t":"Ш /* ================= i18n runtime ================= */
var LANGS=['he','en','fr','ru','ar'], RTL={he:1,ar:1};
var cur = (function(){ try{var s=localStorage.getItem('proactive_lang');
  if(s&&I18N[s])return s;}catch(e){}
  var n=(navigator.language||'he').slice(0,2); return I18N[n]?n:'he'; })();

function t(k,vars){
  var s=(I18N[cur]&&I18N[cur][k]);
  if(s===undefined) s=(I18N.he&&I18N.he[k]);
  if(s===undefined) return k;
  if(vars) for(var v in vars) s=s.split('{'+v+'}').join(vars[v]);
  return s;
}
function esc(s){var d=document.createElement('div');d.textContent=String(s==null?'':s);return d.innerHTML;}
function ic(n,cls){return '<svg class="ic'+(cls?' '+cls:'')+'" aria-hidden="true"><use href="#i-'+n+'"></use></svg>';}

function applyLang(){
  var dir = RTL[cur] ? 'rtl' : 'ltr';
  document.documentElement.lang = cur;
  document.documentElement.dir  = dir;
  document.querySelectorAll('.langbtn').forEach(function(b){ b.classList.toggle('on', b.dataset.lang===cur); });
  document.querySelectorAll('[data-i18n]').forEach(function(el){ el.textContent = t(el.dataset.i18n); });
  document.querySelectorAll('[data-i18n-html]').forEach(function(el){ el.innerHTML = t(el.dataset.i18nHtml); });
  document.querySelectorAll('[data-i18n-ph]').forEach(function(el){ el.placeholder = t(el.dataset.i18nPh); });
  document.querySelectorAll('[data-i18n-title]').forEach(function(el){
    var s=t(el.dataset.i18nTitle); el.title=s; el.setAttribute('aria-label',s);
  });
  var mb=document.getElementById('modeBtn');
  if(mb) mb.setAttribute('data-i18n-title', activeTheme()==='light' ? 'th.dark' : 'th.light');
  document.title = t('seo.title');
  var md=document.querySelector('meta[name="description"]');
  if(md) md.setAttribute('content', t('seo.desc'));
  renderPrices();
}
function setLang(l){
  if(!I18N[l]) return;
  cur = l;
  try{ localStorage.setItem('proactive_lang', l); }catch(e){}
  applyLang();
  // everything drawn by JS must be redrawn - this is what used to be missing
  if(document.getElementById('app').style.display==='block') startApp();
  if(document.getElementById('onboarding').style.display==='block'){
    renderGoalOpts(); markSelected(); renderBuilt(); showStep(os);
  }
}

function guessSteps(g){
  var s=String(g||'').toLowerCase();
  for(var i=0;i<GOAL_MAP.length;i++){
    var e=GOAL_MAP[i];
    for(var L in e.kw){
      var list=e.kw[L];
      for(var j=0;j<list.length;j++) if(s.indexOf(list[j])>=0) return e.steps.slice();
    }
  }
  return ['gm.def.1','gm.def.2','gm.def.3','gm.def.4'];
}

/* ================= dimensions ================= */
var DIMS=[
 {id:'init', k:'dim.init',  icon:'rocket',   em:'🚀'},
 {id:'goal', k:'dim.goal',  icon:'target',   em:'🎯'},
 {id:'time', k:'dim.time',  icon:'clock',    em:'⏱️'},
 {id:'solve',k:'dim.solve', icon:'brain',    em:'🧠'},
 {id:'plan', k:'dim.plan',  icon:'calendar', em:'📅'}
];
function dimById(id){ for(var i=0;i<DIMS.length;i++) if(DIMS[i].id===id) return DIMS[i]; return DIMS[0]; }

/* Ten questions, two per dimension. The four numbers are what each answer is
   worth, in the option order a-b-c-d. They are not a grade - they only decide
   which area the app leans on when it suggests something. */
var QUESTIONS=[
 {n:1,  dim:'time',  v:[100,40,15,60]},
 {n:2,  dim:'init',  v:[100,55,20,70]},
 {n:3,  dim:'goal',  v:[100,60,35,15]},
 {n:4,  dim:'plan',  v:[95,65,35,15]},
 {n:5,  dim:'solve', v:[95,65,25,15]},
 {n:6,  dim:'init',  v:[100,60,30,15]},
 {n:7,  dim:'goal',  v:[100,70,40,20]},
 {n:8,  dim:'plan',  v:[100,65,35,15]},
 {n:9,  dim:'solve', v:[100,65,40,15]},
 {n:10, dim:'time',  v:[100,80,30,15]}
];
var QLETTERS=['a','b','c','d'];

function emptyQuiz(){ return {answers:{}, scores:null, i:0, done:false}; }

/* ================= scoring ================= */
function scoreQuiz(){
  var q=S.quiz||emptyQuiz(), sum={}, count={};
  DIMS.forEach(function(d){ sum[d.id]=0; count[d.id]=0; });
  QUESTIONS.forEach(function(Q){
    var pick=q.answers[Q.n];
    var idx=QLETTERS.indexOf(pick);
    if(idx<0) return;
    sum[Q.dim]+=Q.v[idx]; count[Q.dim]++;
  });
  var out={};
  DIMS.forEach(function(d){
    out[d.id]= count[d.id] ? Math.round(sum[d.id]/count[d.id]) : 0;
  });
  return out;
}
function quizAnswered(){
  var q=S.quiz||{}, n=0;
  QUESTIONS.forEach(function(Q){ if(q.answers && q.answers[Q.n]) n++; });
  return n;
}
function hasProfile(){ return !!(S.quiz && S.quiz.scores); }
function profileIndex(){
  if(!hasProfile()) return 0;
  var t=0; DIMS.forEach(function(d){ t+=S.quiz.scores[d.id]||0; });
  return Math.round(t/DIMS.length);
}
function bandKey(v){ return v>=80?'rs.b4' : v>=65?'rs.b3' : v>=40?'rs.b2' : 'rs.b1'; }

/* Ties resolve by DIMS order rather than by whichever key the engine happens to
   walk first, so the same answers always produce the same profile text. */
function extremeDim(want){
  if(!hasProfile()) return DIMS[0].id;
  var best=DIMS[0].id, bv=S.quiz.scores[DIMS[0].id]||0;
  DIMS.forEach(function(d){
    var v=S.quiz.scores[d.id]||0;
    if(want==='high' ? v>bv : v<bv){ bv=v; best=d.id; }
  });
  return best;
}
function strongDim(){ return extremeDim('high'); }
function weakDim(){ return extremeDim('low'); }

/* The check-in is also what sets the challenge level, so someone who is
   already organised is not handed beginner-sized tasks and someone who is
   drowning is not handed a wall of them. */
function applyProfileToPlan(){
  var v=profileIndex();
  P.diff = v>=72 ? 'hard' : v>=45 ? 'mid' : 'easy';
}

/* ================= the check-in screen ================= */
function quizOptionRow(Q,letter,i){
  var chosen = (S.quiz.answers[Q.n]===letter);
  return '<button class="qz-opt'+(chosen?' on':'')+'" type="button" data-qa="'+letter+'" '+
    'aria-pressed="'+(chosen?'true':'false')+'">'+
    '<span class="qz-let" aria-hidden="true">'+letter.toUpperCase()+'</span>'+
    '<span class="qz-tx">'+esc(t('qz.'+Q.n+'.'+letter))+'</span>'+
    '<span class="qz-tick" aria-hidden="true">'+ic('check')+'</span></button>';
}
function renderQuiz(){
  if(!S.quiz) S.quiz=emptyQuiz();
  var i=Math.min(Math.max(0,S.quiz.i),QUESTIONS.length-1);
  S.quiz.i=i;
  var Q=QUESTIONS[i], total=QUESTIONS.length;

  var count=document.getElementById('qzCount');
  if(count) count.textContent=t('qz.count',{n:i+1,t:total});
  var bar=document.getElementById('qzBar');
  if(bar){ bar.style.width=Math.round((i+1)/total*100)+'%'; }
  /* The overlay header keeps showing where the user is in SETUP; the question
     counter lives inside the card. Printing the question count in both places
     read as two different progress bars for the same thing. */
  var top=document.getElementById('stepCount');
  if(top) top.textContent=t('o.step',{n:4,t:ONB_TOTAL});
  var onb=document.getElementById('onbBar');
  if(onb) onb.style.width=Math.round((3+(i+1)/total)/ONB_TOTAL*100)+'%';
  /* One question at a time means the question should be the first thing on
     screen. The title and the "no right answers" note have done their job
     after question one. */
  var intro=document.getElementById('qzIntro');
  if(intro) intro.hidden = i>0;

  var tag=document.getElementById('qzDim');
  if(tag) tag.textContent=t(dimById(Q.dim).k);

  document.getElementById('qzQ').textContent=t('qz.'+Q.n+'.q');
  var box=document.getElementById('qzOpts');
  box.innerHTML=QLETTERS.map(function(L,ix){ return quizOptionRow(Q,L,ix); }).join('');
  box.querySelectorAll('[data-qa]').forEach(function(b){
    b.addEventListener('click',function(){ answerQuiz(b.dataset.qa); });
  });
  var prev=document.getElementById('qzPrev');
  if(prev) prev.style.visibility = i===0 ? 'hidden' : 'visible';
}
function answerQuiz(letter){
  var Q=QUESTIONS[S.quiz.i];
  S.quiz.answers[Q.n]=letter;
  saveQuiz();
  if(S.quiz.i < QUESTIONS.length-1){
    S.quiz.i++;
    renderQuiz();
  } else {
    finishQuiz();
  }
}
function finishQuiz(){
  S.quiz.scores=scoreQuiz();
  S.quiz.done=true;
  applyProfileToPlan();
  saveQuiz();
  unlock('ach.quiz');
  if(document.getElementById('onboarding').style.display==='block'){
    showStep(5);
  } else {
    renderProfile('profBody');
    toast(t('rs.updated'));
  }
}
/* The check-in runs before onboarding finishes, i.e. before save() is allowed
   to write a profile, so its answers get their own key and are folded back in
   by load(). Losing ten answers to a mistimed refresh would be the one thing
   nobody would re-enter. */
function saveQuiz(){
  try{ localStorage.setItem('proactive_quiz', JSON.stringify(S.quiz)); }catch(e){}
}
function loadQuiz(){
  try{
    var raw=localStorage.getItem('proactive_quiz');
    if(raw){
      var q=JSON.parse(raw);
      if(q && q.answers) S.quiz=q;
    }
  }catch(e){}
  if(!S.quiz) S.quiz=emptyQuiz();
}
function restartQuiz(){
  S.quiz=emptyQuiz(); saveQuiz();
}

/* ================= the profile ================= */
function meterRow(d){
  var v=(S.quiz.scores && S.quiz.scores[d.id])||0;
  return '<div class="mtr">'+
    '<div class="mtr-top"><span class="mtr-n">'+ic(d.icon)+'<span>'+esc(t(d.k))+'</span></span>'+
    '<span class="mtr-v numf">'+v+'%</span></div>'+
    '<div class="mtr-bar"><i style="width:'+v+'%"></i></div></div>';
}
/* On a perfectly flat profile strongest and weakest are the same dimension, and
   the sentence still reads correctly: "you are good at X, but sometimes X". */
function profileMeaning(){
  return t('rs.line',{strong:t('rs.st.'+strongDim()), grow:t('rs.gr.'+weakDim())});
}
function profileActions(){
  var w=weakDim();
  return [1,2,3].map(function(n){ return t('rs.ac.'+w+'.'+n); });
}
/* compact:true is the dashboard version - the score and the five bars only.
   The reading of it, and the three things to try, live on the Progress tab so
   the first screen does not turn into a report. */
function renderProfile(boxId, compact){
  var box=document.getElementById(boxId);
  if(!box) return;
  if(!hasProfile()){
    box.innerHTML='<div class="empty">'+esc(t('rs.none'))+'</div>'+
      '<button class="btn btn-primary" data-goquiz>'+esc(t('n.hero.cta'))+'</button>';
    bindGoQuiz(box);
    return;
  }
  var idx=profileIndex();
  var head=
   '<div class="pro-score">'+
     '<div class="pro-num numf">'+idx+'<span>%</span></div>'+

/* One suggestion a day, drawn from the area the check-in flagged as weakest so
   the app leans where the user actually needs it. Without a profile it falls
   back to the generic challenge list. */
function pickNextStep(){
  var day=dayKey();
  if(S.next && S.next.day===day) return S.next;
  var key, theme='';
  if(hasProfile()){
    var w=weakDim();
    var seed=Math.abs(hashDay(day)) % 3 + 1;
    key='rs.ac.'+w+'.'+seed;
    theme=t(dimById(w).k);
  } else {
    var c=CHALLENGES[Math.abs(hashDay(day)) % CHALLENGES.length];
    key=c.t; theme=t(c.th);
  }
  S.next={day:day, key:key, theme:theme, done:false};
  save();
  return S.next;
}
/* A tiny string hash so the suggestion is stable for a given day instead of
   changing on every repaint. */
function hashDay(s){
  var h=0;
  for(var i=0;i<s.length;i++){ h=(h*31 + s.charCodeAt(i))|0; }
  return h;
}

/* Local calendar day, not UTC - with UTC the day would roll over at the wrong
   hour and break every streak for anyone not on GMT. */
function dayKey(d){
  d = d || new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function daysBetween(a,b){
  return Math.round((new Date(b+'T00:00:00') - new Date(a+'T00:00:00'))/86400000);
}
/* Shared by the sport and skincare mini-apps: same day is a no-op, yesterday
   extends the run, any longer gap starts over. */
function bumpStreak(o,day){
  day = day || dayKey();
  if(o.lastDay === day) return o.streak;
  o.streak = (o.lastDay && daysBetween(o.lastDay, day) === 1) ? (o.streak||0)+1 : 1;
  o.lastDay = day;
  return o.streak;
}
/* A run that was broken before today should read as 0, not as its stale value. */
function liveStreak(o){
  if(!o || !o.lastDay) return 0;
  var gap = daysBetween(o.lastDay, dayKey());
  return (gap === 0 || gap === 1) ? (o.streak||0) : 0;
}

/* ids must never collide with ids already sitting in storage, whatever their
   origin - a stale counter silently makes one checkbox toggle another row. */
function reseedUid(){
  var max=0;
  function seen(n){ n=Number(n); if(n>max) max=n; }
  (S.tasks||[]).forEach(function(x){ seen(x.id); });
  (S.missions||[]).forEach(function(x){ seen(x.id); });
  (S.goals||[]).forEach(function(g){ seen(g.id); (g.actions||[]).forEach(function(a){ seen(a.id); }); });
  (P.customCats||[]).forEach(function(c){ var m=/^custom_(\d+)$/.exec(c.id||''); if(m) seen(m[1]); });
  var stored=Number(localStorage.getItem('proactive_uid'))||1;
  uid=Math.max(stored,max+1,1);
}

/* v1 stored every task, mission and category label as a hardcoded Hebrew
   string and category icons as emoji, so carrying that straight into the new
   build leaves Hebrew text in the other four languages and icon references
   that resolve to nothing. Keep the progress, rebuild the labelled parts. */
function migrateV1(){
  P.customCats=(P.customCats||[]).map(function(c){
    return {id:c.id, name:c.name, icon:'star', custom:true, sg:['sg.generic']};
  });
  P.easy=[]; P.hard=[];                 // v1 stored these as Hebrew literals
  S.tasks=[]; S.missions=[]; S.plan={}; // re-seeded below from the new schema
  S.goals=(S.goals||[]).map(function(g){
    return {id:g.id, title:g.title,     // the user typed these, so they stay
            actions:guessSteps(g.title).map(function(k){
              return {id:0,key:k,text:'',done:false};
            })};
  });
  if(!P.trialStart) P.trialStart=Date.now();
}

/* v2 predates the mini-apps. Additive only: nothing stored by v2 is touched. */
function migrateV2(){
  if(!S.mini) S.mini=emptyMini();
}

/* Fields the v4 schema adds. Object.assign in load() merges a stored save over
   the defaults, so a v3 save arrives with these already present (as defaults);
   this only backfills a save that was hand-edited or partially written. */
function ensureV4Fields(){
  if(!S.quiz) S.quiz=emptyQuiz();
  if(!S.lessons) S.lessons={};
  if(!S.ach) S.ach={};
  if(!S.day) S.day={streak:0,lastDay:null};
  if(!S.stats) S.stats={tasksDone:0, challenges:0, comebacks:0, bestStreak:0};
}

/* v3 predates the check-in, the lessons, the achievements and the real day
   streak. Additive only: nothing stored by v3 is touched. The old S.streak
   counted ticks rather than days, so it seeds stats.tasksDone - which is what
   it actually measured - and the day streak starts fresh instead of inheriting
   a number that never meant days. */
function migrateV3(){
  ensureV4Fields();
  S.stats.tasksDone = Number(S.streak)||0;
}

/* Every real action routes through here: it is the single place that decides
   the day streak, so nothing can bump it twice in one day and a missed day
   simply starts a new run instead of "failing". */
function markActiveToday(){
  if(!S.day) S.day={streak:0,lastDay:null};
  var day=dayKey();
  if(S.day.lastDay===day) return;
  var broke = S.day.lastDay && daysBetween(S.day.lastDay,day)>1;
  bumpStreak(S.day,day);
  if(broke) S.stats.comebacks=(S.stats.comebacks||0)+1;
  S.stats.bestStreak=Math.max(S.stats.bestStreak||0, S.day.streak||0);
  save();
}
function shownStreak(){ return liveStreak(S.day); }
function streakLine(){
  var n=shownStreak();
  if(S.day && S.day.lastDay && daysBetween(S.day.lastDay,dayKey())>1) return t('d.sk.miss');
  return n<=0 ? t('d.sk.0') : n===1 ? t('d.sk.1') : t('d.sk.n',{n:n});
}

function load(){ try{
  var p=localStorage.getItem('proactive_p'), s=localStorage.getItem('proactive_s');
  if(!p||!s) return false;
  P=Object.assign(P,JSON.parse(p)); S=Object.assign(S,JSON.parse(s));
  reseedUid();                          // before anything hands out a new id
  var v=Number(localStorage.getItem('proactive_v'))||1;
  if(v<2){
    migrateV1();
    buildCats();
    seedTasks(); seedMissions();        // rebuilt in the new shape; goals kept
    S.goals.forEach(function(g){
      g.id=uid++; g.actions.forEach(function(a){ a.id=uid++; });
    });
  }
  if(v<3) migrateV2();                  // chains, so a v1 save lands on v4
  if(v<4) migrateV3();
  if(!S.mini) S.mini=emptyMini();       // belt and braces for a hand-edited save
  ensureV4Fields();
  loadQuiz();                           // answers saved before onboarding ended
  if(v<STORE_V) save();
  return true;
}catch(e){ return false; } }

  if(!CATS.length) CATS = ALL_CATS.slice();
}

function finishOnboarding(){

  if(os===7 && !P.userGoals.length) readFirstGoal();
  if(!P.trialStart) P.trialStart=Date.now();

  buildCats(); seedState();
  if(S.quiz && !S.quiz.scores && quizAnswered()) { S.quiz.scores=scoreQuiz(); applyProfileToPlan(); }

  save(); checkAchievements();
  document.getElementById('onboarding').style.display='none';

      title:cat.custom?cat.name:'',

function E(k,r,cue){ return {k:k, r:r, cue:cue||''}; }

var SPORT_TYPES=['general','strength','core','flex','short'];
function workoutMinutes(list){ return Math.max(3, Math.round(list.length*1.6)); }

var restTimer=null;

/* the seven dates of the current week, Sunday first */
function weekDays(){
  var now=new Date(), out=[];
  var start=new Date(now); start.setDate(now.getDate()-now.getDay());
  for(var i=0;i<7;i++){ var d=new Date(start); d.setDate(start.getDate()+i); out.push(dayKey(d)); }
  return out;
}

      ic('arrow')+'</button>';

  var list=workoutSets()[type];
  run={type:type, list:list, i:0, started:Date.now()};
  renderRun();

}

function renderRun(){
  clearRest();
  var ex=run.list[run.i], total=run.list.length;
  document.getElementById('spOf').textContent=t('sp.of',{n:run.i+1,t:total});
  document.getElementById('spExName').textContent=t(ex.k);
  document.getElementById('spExReps').textContent=ex.r;
  document.getElementById('spExCue').textContent=ex.cue?t(ex.cue):'';
  document.getElementById('spDots').innerHTML=run.list.map(function(_,i){
    return '<span class="dot'+(i<run.i?' done':'')+(i===run.i?' now':'')+'"></span>';
  }).join('');
  document.getElementById('spRest').classList.remove('on');
  document.getElementById('spExBody').classList.remove('resting');
}

function clearRest(){
  if(restTimer){ clearInterval(restTimer); restTimer=null; }
  var r=document.getElementById('spRest');
  if(r) r.classList.remove('on');
}

function finishExercise(){
  if(!run) return;
  if(run.i >= run.list.length-1){ endRun(); return; }
  var left=25;
  var nextName=t(run.list[run.i+1].k);
  var box=document.getElementById('spRest');
  var num=document.getElementById('spRestN');
  document.getElementById('spRestNext').textContent=t('sp.next',{x:nextName});
  document.getElementById('spExBody').classList.add('resting');
  box.classList.add('on');
  num.textContent=left;
  restTimer=setInterval(function(){
    left--;
    num.textContent=Math.max(0,left);
    if(left<=0) advance();
  },1000);
}
function advance(){
  clearRest();
  if(!run) return;
  run.i++;
  if(run.i>=run.list.length){ endRun(); return; }
  renderRun();
}

function endRun(){
  clearRest();
  if(!run) return;
  var sp=miniState().sport;
  var mins=Math.max(1, Math.round((Date.now()-run.started)/60000)) || 1;
  var n=run.list.length;
  sp.sessions.unshift({d:dayKey(), type:run.type, n:n, mins:mins});
  if(sp.sessions.length>60) sp.sessions.length=60;
  bumpStreak(sp);
  addPts(15);
  save();
  document.getElementById('spDoneN').textContent=t('sp.done.n',{n:n});
  document.getElementById('spDoneM').textContent=t('sp.done.m',{m:mins});
  document.getElementById('spDoneMsg').textContent=t(pick(['sp.enc.1','sp.enc.2','sp.enc.3','sp.enc.4']));
  run=null;
  renderStats();
  sportScreen('done');
}

/* Reuses buildSkin(), so the wording and the per-step explanations stay the
   ones already translated for the routine that shipped before. */
function buildRoutine(){
  var d=skinDraft;
  var type=({normal:'normal',oily:'oily',dry:'dry',combo:'combo'})[d.feel]||'normal';
  var blocks=buildSkin(type);
  var am=blocks[0].items.slice(), pm=blocks[1].items.slice();
  if(d.depth==='basic'){                  // drop the optional middle step
    am=[am[0],am[am.length-1]];
    pm=[pm[1],pm[2]];
  }
  function step(it){ return {n:it.n, d:it.d, product:''}; }
  return {type:type, react:d.react, am:am.map(step), pm:pm.map(step)};
}

function renderSkinRoutine(){
  var sk=miniState().skin, today=dayKey();
  var log=sk.log[today]||{};
  function list(which){
    return sk.routine[which].map(function(s,i){
      return '<div class="sn-step">'+
        '<span class="sn-num">'+(i+1)+'</span>'+
        '<div class="sn-body"><div class="sn-n">'+esc(s.n)+'</div>'+
        (s.d?'<div class="sn-d">'+esc(s.d)+'</div>':'')+
        '<input type="text" class="sn-p" data-sn-w="'+which+'" data-sn-i="'+i+'" '+
        'value="'+esc(s.product||'')+'" placeholder="'+esc(t('sn.product.ph'))+'"></div></div>';
    }).join('');
  }
  document.getElementById('snAm').innerHTML=list('am');
  document.getElementById('snPm').innerHTML=list('pm');

  var amBtn=document.getElementById('snDoAm'), pmBtn=document.getElementById('snDoPm');
  amBtn.classList.toggle('done', !!log.am);
  pmBtn.classList.toggle('done', !!log.pm);
  amBtn.innerHTML=ic(log.am?'check':'sun')+'<span>'+esc(t(log.am?'sn.done.am':'sn.did.am'))+'</span>';
  pmBtn.innerHTML=ic(log.pm?'check':'moon')+'<span>'+esc(t(log.pm?'sn.done.pm':'sn.did.pm'))+'</span>';

  var wk=weekDays(), count=0;
  wk.forEach(function(d){ var l=sk.log[d]; if(l&&(l.am||l.pm)) count++; });
  document.getElementById('snStreak').textContent=liveStreak(sk);
  document.getElementById('snWeek').textContent=count+'/7';

  var names=dayNames();
  document.getElementById('snBoard').innerHTML=wk.map(function(d,i){
    var l=sk.log[d]||{};
    var full=l.am&&l.pm, part=l.am||l.pm;
    return '<div class="wk-cell'+(full?' on':(part?' half':''))+(d===today?' today':'')+'">'+
      '<span class="wk-d">'+esc(names[i])+'</span>'+
      '<span class="wk-m">'+(part?ic('check'):'')+'</span></div>';
  }).join('');

  var days=Object.keys(sk.log).sort().reverse().slice(0,7);
  document.getElementById('snHist').innerHTML = days.length
    ? days.map(function(d){
        var l=sk.log[d]||{};
        var parts=[];
        if(l.am) parts.push(t('sn.am'));
        if(l.pm) parts.push(t('sn.pm'));
        return '<div class="hist-row"><span class="hr-n">'+esc(d)+'</span>'+
               '<span class="hr-m">'+esc(parts.join(' · '))+'</span></div>';
      }).join('')
    : '<div class="empty">'+esc(t('sn.hist.empty'))+'</div>';
  skinScreen('routine');
}

function markSkin(which){
  var sk=miniState().skin, today=dayKey();
  if(!sk.log[today]) sk.log[today]={};
  var was=!!sk.log[today][which];

  else { addPts(-6); }
  save(); renderSkinRoutine(); renderStats();
}

function scoreRecipes(){
  var have=miniState().fridge.pantry;
  return RECIPES.map(function(r){
    var hit=r.ing.filter(function(k){ return have.indexOf(k)>=0; });
    var miss=r.ing.filter(function(k){ return have.indexOf(k)<0; });
    return {r:r, hit:hit, miss:miss, score:hit.length/r.ing.length};
  })
  .filter(function(x){ return x.hit.length>=2 && x.score>=0.5; })
  .sort(function(a,b){ return (b.score-a.score) || (a.miss.length-b.miss.length); });
}

  var fr=miniState().fridge;

var sugFilter='all', sugShown=6;

/* Always-on browsable library. Reuses recipeCard()/withMatch(), so a card here
   marks what you have and saves to favourites exactly like a matched result. */
function renderSuggest(){
  var box=document.getElementById('frSugOut');
  if(!box) return;
  document.querySelectorAll('#frSugFilters .sug-f').forEach(function(b){
    b.classList.toggle('on', b.dataset.sugF===sugFilter);
  });
  var list=RECIPES.filter(function(r){ return matchesFilter(r,sugFilter); });
  if(!list.length){ box.innerHTML='<div class="empty">'+esc(t('fs.empty'))+'</div>'; }
  else box.innerHTML=list.slice(0,sugShown).map(withMatch).map(recipeCard).join('');
  var more=document.getElementById('frSugMore');
  more.style.display = list.length>sugShown ? '' : 'none';
}

function byId(id){ for(var i=0;i<RECIPES.length;i++) if(RECIPES[i].id===id) return RECIPES[i]; return null; }
function withMatch(r){
  var have=miniState().fridge.pantry;
  var hit=r.ing.filter(function(k){ return have.indexOf(k)>=0; });
  var miss=r.ing.filter(function(k){ return have.indexOf(k)<0; });
  return {r:r, hit:hit, miss:miss, score:r.ing.length?hit.length/r.ing.length:0};
}

/* Keep the stored photo small: localStorage is a few MB and a raw phone
   photo would blow the quota and lose everything else with it. */
function shrinkPhoto(dataUrl, cb){
  var img=new Image();
  img.onload=function(){
    var max=900, w=img.width, h=img.height;
    var s=Math.min(1, max/Math.max(w,h));
    var cv=document.createElement('canvas');
    cv.width=Math.round(w*s); cv.height=Math.round(h*s);
    cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);
    try{ cb(cv.toDataURL('image/jpeg',0.7)); }catch(e){ cb(dataUrl); }
  };
  img.onerror=function(){ cb(dataUrl); };
  img.src=dataUrl;
}

var camStream=null;
function openCam(name,cb){
  var modal=document.getElementById('camModal'), v=document.getElementById('camV'),
      pv=document.getElementById('camP'), fi=document.getElementById('camF'),
      bar=document.getElementById('camBtns');
  document.getElementById('camTN').textContent=name;
  pv.style.display='none'; v.style.display='block'; modal.classList.add('on');
  var shot=null;

  function stop(){ if(camStream){ camStream.getTracks().forEach(function(t){t.stop();}); camStream=null; } }
  function close(){ stop(); modal.classList.remove('on'); }
  function mk(cls,html){ var b=document.createElement('button'); b.className='btn '+cls; b.innerHTML=html; return b; }

  function buttons(mode){
    bar.innerHTML='';
    if(mode==='live'){
      var s=mk('btn-primary', ic('camera')+'<span>'+esc(t('c.takephoto'))+'</span>'),
          g=mk('btn-ghost',   ic('image')+'<span>'+esc(t('c.gallery'))+'</span>'),
          c=mk('btn-quiet',   esc(t('c.cancel')));
      s.onclick=function(){
        var cv=document.createElement('canvas');
        cv.width=v.videoWidth||640; cv.height=v.videoHeight||480;
        cv.getContext('2d').drawImage(v,0,0,cv.width,cv.height);
        shot=cv.toDataURL('image/jpeg',0.6);
        pv.src=shot; pv.style.display='block'; v.style.display='none'; stop(); buttons('ok');
      };
      g.onclick=function(){ fi.click(); };
      c.onclick=close;
      bar.append(s,g,c);
    } else if(mode==='upload'){
      var u=mk('btn-primary', ic('image')+'<span>'+esc(t('c.choosephoto'))+'</span>'),
          c2=mk('btn-quiet', esc(t('c.cancel')));
      u.onclick=function(){ fi.click(); }; c2.onclick=close;
      bar.append(u,c2);
    } else {
      var ok=mk('btn-primary', ic('check')+'<span>'+esc(t('c.use'))+'</span>'),
          re=mk('btn-ghost', esc(t('c.retake')));
      ok.onclick=function(){ close(); cb(shot); };
      re.onclick=function(){ pv.style.display='none'; start(); };
      bar.append(ok,re);
    }
  }
  fi.onchange=function(e){
    var f=e.target.files[0]; if(!f) return;
    var r=new FileReader();
    r.onload=function(ev){ shot=ev.target.result; pv.src=shot; pv.style.display='block';
      v.style.display='none'; stop(); buttons('ok'); };
    r.readAsDataURL(f); fi.value='';
  };
  function start(){
    v.style.display='block';
    if(navigator.mediaDevices && navigator.mediaDevices.getUserMedia){
      navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}})
        .then(function(s){ camStream=s; v.srcObject=s; buttons('live'); })
        .catch(function(){ v.style.display='none'; buttons('upload'); });
    } else { v.style.display='none'; buttons('upload'); }
  }
  start();
}

function renderRing(){
  var svg=document.getElementById('rSvg');
  var r=54, cx=66, cy=66, sw=10, circ=2*Math.PI*r;
  var track=cssVar('--ink-3')||'#333947', fill=cssVar('--acc')||'#3DDCA8';
  var total=S.tasks.length;
  if(!total){
    svg.innerHTML='<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="none" stroke="'+track+'" stroke-width="'+sw+'" stroke-dasharray="3 7"/>';
    document.getElementById('rPct').textContent='0%'; return;
  }
  var out='', off=0;
  CATS.forEach(function(cat){
    var ct=S.tasks.filter(function(x){ return x.catId===cat.id; });
    if(!ct.length) return;
    var done=ct.filter(function(x){ return x.done; }).length;
    var seg=(ct.length/total)*circ, filled=seg*(done/ct.length);
    out+='<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="none" stroke="'+track+'" stroke-width="'+sw+'" stroke-dasharray="'+(seg-2)+' '+(circ-seg+2)+'" stroke-dashoffset="'+(-off)+'"/>';
    if(filled>0)
      out+='<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="none" stroke="'+fill+'" stroke-width="'+sw+'" stroke-linecap="round" stroke-dasharray="'+Math.max(0,filled-2)+' '+(circ-filled+2)+'" stroke-dashoffset="'+(-off)+'"/>';
    off+=seg;
  });
  svg.innerHTML=out;
  var d=S.tasks.filter(function(x){ return x.done; }).length;
  document.getElementById('rPct').textContent=Math.round(d/total*100)+'%';
}

var timers={};
function startTimer(btn,minutes){
  var id=btn.dataset.tid;
  if(timers[id]){ clearInterval(timers[id]); delete timers[id];
    btn.classList.remove('run'); btn.innerHTML=ic('play'); return; }
  var left=minutes*60;
  btn.classList.add('run');
  timers[id]=setInterval(function(){
    left--;
    btn.textContent=Math.floor(left/60)+':'+String(left%60).padStart(2,'0');
    if(left<=0){
      clearInterval(timers[id]); delete timers[id];
      btn.classList.remove('run'); btn.innerHTML=ic('play'); toast(t('t.timerdone'));
    }
  },1000);
}

/* ================= goals ================= */
/* The point of this screen is the ladder: a goal is only real once it says
   what it means this week, what it means today, and what you do right now. */
function goalById(id){
  var g=null;
  (S.goals||[]).forEach(function(x){ if(x.id===id) g=x; });
  return g;
}
function goalPct(g){
  if(!g.actions.length) return 0;
  var done=g.actions.filter(function(a){ return a.done; }).length;
  return Math.round(done/g.actions.length*100);
}
function renderGoals(){
  var box=document.getElementById('goalsCont'); box.innerHTML='';
  if(!S.goals.length){
    box.innerHTML='<div class="empty-state">'+ic('target')+
      '<p>'+esc(t('n.empty.goals'))+'</p></div>';
    return;
  }
  S.goals.forEach(function(g){
    var done=g.actions.filter(function(a){ return a.done; }).length;
    var pct=goalPct(g);
    var card=document.createElement('article'); card.className='goal';
    card.innerHTML=
      '<h3>'+ic('target')+'<span>'+esc(g.title)+'</span>'+
      '<button class="icon-btn" data-dg="'+g.id+'" aria-label="'+esc(t('c.delete'))+'">'+ic('trash')+'</button></h3>'+

      '<div class="ladder">'+
        '<div class="rung"><span class="rung-k">'+esc(t('gl.goal'))+'</span>'+
          '<span class="rung-v strong">'+esc(g.title)+'</span></div>'+
        '<div class="rung"><span class="rung-k">'+esc(t('gl.week'))+'</span>'+
          '<input type="text" class="rung-in" data-lad="week" data-gid="'+g.id+'" '+
          'value="'+esc(g.week||'')+'" placeholder="'+esc(t('gl.wk.ph'))+'" aria-label="'+esc(t('gl.week'))+'"></div>'+
        '<div class="rung"><span class="rung-k">'+esc(t('gl.today'))+'</span>'+
          '<input type="text" class="rung-in" data-lad="today" data-gid="'+g.id+'" '+
          'value="'+esc(g.today||'')+'" placeholder="'+esc(t('gl.td.ph'))+'" aria-label="'+esc(t('gl.today'))+'"></div>'+
        '<div class="rung now"><span class="rung-k">'+esc(t('gl.now'))+'</span>'+
          '<button class="btn btn-primary btn-sm" data-gnow="'+g.id+'">'+ic('play')+
          '<span>'+esc(t('gl.now.btn'))+'</span></button></div>'+
      '</div>'+

      '<div class="acts-h">'+esc(t('gl.steps'))+'</div>'+
      '<div class="acts">'+g.actions.map(function(a){
        return '<label><input type="checkbox" class="cb" data-gid="'+g.id+'" data-aid="'+a.id+'"'+
          (a.done?' checked':'')+'><span'+(a.done?' class="done"':'')+'>'+esc(actLabel(a))+'</span></label>';
      }).join('')+'</div>'+
      '<div class="addrow"><input type="text" class="na" data-gid="'+g.id+'" placeholder="'+esc(t('g.step.ph'))+'" aria-label="'+esc(t('g.step.ph'))+'">'+
      '<button class="btn btn-ghost" data-na="'+g.id+'" aria-label="'+esc(t('c.add'))+'">'+ic('plus')+'</button></div>'+
      '<div class="gmeta"><span class="numf">'+done+'/'+g.actions.length+'</span><span class="numf">'+pct+'%</span></div>'+
      '<div class="gbar"><i style="width:'+pct+'%"></i></div>';
    box.appendChild(card);
  });

  box.querySelectorAll('.cb').forEach(function(cb){
    cb.addEventListener('change',function(e){
      var g=goalById(Number(e.target.dataset.gid)), a=null;
      if(!g) return;
      g.actions.forEach(function(x){ if(x.id===Number(e.target.dataset.aid)) a=x; });
      if(!a) return;
      a.done=e.target.checked; addPts(a.done?12:-12);
      if(a.done){ toast(t('t.step')); markActiveToday(); }
      save(); renderGoals(); renderStats(); renderDash(); checkAchievements();
    });
  });
  box.querySelectorAll('[data-dg]').forEach(function(b){
    b.addEventListener('click',function(){
      S.goals=S.goals.filter(function(g){ return g.id!==Number(b.dataset.dg); });
      save(); renderGoals(); renderDash();
    });
  });
  box.querySelectorAll('[data-na]').forEach(function(b){
    b.addEventListener('click',function(){

      if(!g) return;

      if(!v) return;
      g.actions.push({id:uid++,key:null,text:v,done:false});
      inp.value=''; save(); renderGoals();
    });
  });
  /* The ladder inputs save on blur rather than on every keystroke: a full
     re-render mid-typing would steal the caret. */
  box.querySelectorAll('.rung-in').forEach(function(inp){
    inp.addEventListener('change',function(){

  });

/* ================= week ================= */
function dayNames(){
  var base=new Date(2024,0,7); // a Sunday
  var out=[];
  for(var i=0;i<7;i++){
    var d=new Date(base); d.setDate(base.getDate()+i);
    out.push(d.toLocaleDateString(cur,{weekday:'short'}));
  }
  return out;
}
function missionState(m){
  var c=m.days.filter(Boolean).length;
  if(m.target>0 && c>=m.target) return {txt:t('w.st.win'), cls:'win', met:true};
  if(c>0 && c>=Math.ceil(m.target/2)) return {txt:t('w.st.close'), cls:'mid', met:false};
  if(c>0) return {txt:t('w.st.going'), cls:'mid', met:false};
  return {txt:t('w.st.none'), cls:'none', met:false};
}
function renderWeek(){
  var days=dayNames(), today=new Date().getDay();
  document.getElementById('wHead').innerHTML=
    '<th class="mcol">'+esc(t('w.col.mission'))+'</th>'+
    days.map(function(d,i){ return '<th'+(i===today?' class="today"':'')+'>'+esc(d)+'</th>'; }).join('')+
    '<th>'+esc(t('w.col.status'))+'</th>';

  var body=document.getElementById('wBody'); body.innerHTML='';
  var met=0;
  S.missions.forEach(function(m){
    var cat=catById(m.catId)||{icon:'star'};
    var st=missionState(m); if(st.met) met++;
    var count=m.days.filter(Boolean).length;
    var tr=document.createElement('tr');
    var html='<td class="mcol"><div class="mrow">'+ic(cat.icon)+
      '<div><div class="mt">'+esc(label(m))+'</div>'+
      '<div class="mm">'+esc(t('w.target'))+' <span class="numf">'+count+'/'+m.target+'</span></div></div>'+
      '<button class="icon-btn" data-dm="'+m.id+'" aria-label="'+esc(t('c.delete'))+'">'+ic('x')+'</button></div></td>';
    m.days.forEach(function(on,di){
      html+='<td class="dcell'+(on?' on':'')+'" data-mid="'+m.id+'" data-day="'+di+'">'+
            '<span class="mk">'+ic('check')+'</span></td>';
    });
    html+='<td class="scell '+st.cls+'">'+esc(st.txt)+'</td>';
    tr.innerHTML=html; body.appendChild(tr);
  });
  if(!S.missions.length)
    body.innerHTML='<tr><td colspan="9" class="empty" style="padding:var(--s4)">'+esc(t('w.empty'))+'</td></tr>';

  document.getElementById('wMet').textContent=met;
  document.getElementById('wTot').textContent=S.missions.length;

  body.querySelectorAll('.dcell').forEach(function(cell){
    cell.addEventListener('click',function(){
      var m=null;
      S.missions.forEach(function(x){ if(x.id===Number(cell.dataset.mid)) m=x; });
      if(!m) return;
      var d=Number(cell.dataset.day);
      m.days[d]=!m.days[d];
      addPts(m.days[d]?6:-6);
      if(m.days[d]){ toast(praise()); markActiveToday(); }
      save(); renderWeek(); renderStats(); renderDash(); checkAchievements();
    });
  });
  body.querySelectorAll('[data-dm]').forEach(function(b){
    b.addEventListener('click',function(){
      S.missions=S.missions.filter(function(m){ return m.id!==Number(b.dataset.dm); });
      save(); renderWeek();
    });
  });
}

/* ================= body plans ================= */
function renderPlan(gridId,blocks,prefix){
  var grid=document.getElementById(gridId); grid.innerHTML='';
  blocks.forEach(function(block,bi){
    var card=document.createElement('div'); card.className='pcard';
    var title = block.k ? t(block.k) : block.label;
    var items=block.items.map(function(item,ii){
      var key=prefix+'-'+bi+'-'+ii;
      var checked=S.plan[key]?' checked':'';
      var name = item.k ? t(item.k) : item.n;
      var cam  = item.k ? false : !!item.cam;   // workout items are not photo-gated
      var meta = item.r ? '<span class="pr">'+ic('clock')+esc(item.r)+'</span>'
               : cam    ? '<span class="pr">'+ic('camera')+'</span>' : '';
      return '<div class="pitem">'+
        '<input type="checkbox" class="cb" data-key="'+key+'" data-cam="'+(cam?1:0)+'" data-name="'+esc(name)+'"'+checked+'>'+
        '<div class="pb"><span class="px'+(checked?' done':'')+'">'+esc(name)+'</span>'+
        (item.d?'<div class="pd">'+esc(item.d)+'</div>':'')+'</div>'+meta+'</div>';
    }).join('');
    card.innerHTML='<h3><span>'+esc(title)+'</span><span class="dnum">'+t('c.day')+' '+(bi+1)+'</span></h3>'+
      (block.sub?'<div class="psub2">'+esc(block.sub)+'</div>':'')+items;
    grid.appendChild(card);
  });

  grid.querySelectorAll('.cb').forEach(function(cb){
    cb.addEventListener('change',function(e){
      var key=e.target.dataset.key;
      if(e.target.checked){
        if(e.target.dataset.cam==='1'){
          e.target.checked=false;
          openCam(e.target.dataset.name,function(){
            S.plan[key]=true; addPts(8); toast(t('t.proof'));
            save(); renderPlan(gridId,blocks,prefix); renderStats();
          });
        } else {
          S.plan[key]=true; addPts(8); toast(praise()); save(); renderStats();
          var px=e.target.closest('.pitem').querySelector('.px'); if(px) px.classList.add('done');
        }
      } else {
        delete S.plan[key]; addPts(-8); save(); renderStats();
        var px2=e.target.closest('.pitem').querySelector('.px'); if(px2) px2.classList.remove('done');
      }
    });
  });
}

/* ---- the single next step, and the five-minute starter ---- */
var fiveTimer=null, fiveLeft=0;
function clearFive(){
  if(fiveTimer){ clearInterval(fiveTimer); fiveTimer=null; }
}
function startFiveMinutes(labelText){
  clearFive();
  fiveLeft=5*60;
  markActiveToday();
  goPage('home');
  renderNextCard(labelText);
  fiveTimer=setInterval(function(){
    fiveLeft--;
    var el=document.getElementById('fiveTxt');
    if(el){
      var m=Math.floor(fiveLeft/60), sec=String(fiveLeft%60).padStart(2,'0');
      el.textContent=t('d.running',{t:m+':'+sec});
    }
    if(fiveLeft<=0){ clearFive(); toast(t('d.timeup')); renderNextCard(); }
  },1000);
}
function renderNextCard(overrideText){
  var box=document.getElementById('nextCard');
  if(!box) return;
  var step=pickNextStep();
  var txt = overrideText || t(step.key);
  if(step.done && !overrideText){
    box.innerHTML='<div class="next done">'+ic('check')+
      '<div><div class="next-lab">'+esc(t('d.next'))+'</div>'+
      '<p class="next-tx">'+esc(t('d.allclear'))+'</p></div></div>';
    return;
  }
  var running = !!fiveTimer;
  box.innerHTML='<div class="next">'+
    '<div class="next-lab">'+ic('rocket')+'<span>'+esc(t('d.next'))+'</span>'+
      (step.theme?'<span class="next-th">'+esc(step.theme)+'</span>':'')+'</div>'+
    '<p class="next-tx">'+esc(txt)+'</p>'+
    '<p class="next-sub">'+esc(t('d.next.s'))+'</p>'+
    '<div class="next-btns">'+
      '<button class="btn btn-primary" id="fiveBtn"'+(running?' disabled':'')+'>'+ic('play')+
        '<span id="fiveTxt">'+esc(running?t('d.running',{t:'5:00'}):t('d.start5'))+'</span></button>'+
      '<button class="btn btn-ghost" id="nextDone">'+ic('check')+'<span>'+esc(t('d.mark'))+'</span></button>'+
    '</div></div>';
  var fb=document.getElementById('fiveBtn');
  if(fb) fb.addEventListener('click',function(){ startFiveMinutes(txt); });
  document.getElementById('nextDone').addEventListener('click',function(){
    clearFive();
    if(!S.next || S.next.done) return;
    S.next.done=true;
    S.stats.challenges=(S.stats.challenges||0)+1;
    addPts(25); markActiveToday();
    toast(t('t.pts',{n:25}));
    save(); renderNextCard(); renderDashStats(); renderStats(); checkAchievements();
  });
}

}

/* ================= tabs ================= */
/* One <nav> serves as top tabs on a wide screen and as the bottom bar on a
   phone, so there is a single set of buttons and a single source of truth. */
function goPage(name){
  document.querySelectorAll('.tab').forEach(function(x){
    var on=x.dataset.page===name;
    x.classList.toggle('on', on);
    x.setAttribute('aria-selected', on?'true':'false');
  });
  document.querySelectorAll('.page').forEach(function(p){
    p.classList.toggle('on', p.id==='page-'+name);
  });
  try{ localStorage.setItem('proactive_tab', name); }catch(e){}
  if(name==='home') renderDash();
  if(name==='progress'){ renderProfile('profBody'); renderAchievements(); }
  window.scrollTo(0,0);
}
document.querySelectorAll('.tab').forEach(function(tab){
  tab.addEventListener('click',function(){ goPage(tab.dataset.page); });
});
function lastTab(){
  try{
    var v=localStorage.getItem('proactive_tab');
    if(v && document.getElementById('page-'+v)) return v;
  }catch(e){}
  return 'home';
}

/* ================= boot ================= */
function renderTasks(){ renderRing(); renderCats(); }
function renderHome(){ renderTasks(); }   // kept: other modules still call it

function startApp(){
  var name=P.name || t('a.greet.anon');
  document.getElementById('greetName').textContent=t('a.greet',{name:name});
  document.getElementById('proQuote').textContent=t(pick(QUOTES));
  try{
    document.getElementById('dateStr').textContent=
      new Date().toLocaleDateString(cur,{weekday:'long',day:'numeric',month:'long'});
  }catch(e){ document.getElementById('dateStr').textContent=''; }

  var wp=buildWorkout(P.age,P.workout,P.fitLevel);
  document.getElementById('woSub').textContent=
    t('c.age')+' '+wp.ageBand+' · '+t(wp.levelKey)+' · '+t('wo.'+P.workout);
  document.getElementById('woInfo').innerHTML=ic('sliders')+'<span>'+esc(wp.note)+'</span>';

  fillMissionCats(); renderInsight(); renderTasks(); renderGoals(); renderWeek();
  renderPlan('woGrid', wp.blocks, 'w');   // the "my weekly plan" section of the sport mini-app
  renderPlan('hyGrid', buildHygiene(), 'hy');
  renderTheories(); renderLessons(); renderAchievements();
  renderStats(); renderTrial();
  renderMini();                            // the skincare routine lives in its mini-app
  renderDash();
  checkAchievements();
  goPage(lastTab());
}

document.querySelectorAll('.langbtn').forEach(function(b){
  b.addEventListener('click',function(){ setLang(b.dataset.lang); });
});

bindMini();
bindAccentPick();
loadLook();
applyTheme();
loadQuiz();
applyLang();
renderGoalOpts();
['oTime','oWO','oFL','oSkin'].forEach(function(id){
  var attr={oTime:'time',oWO:'wo',oFL:'fl',oSkin:'skin'}[id];
  var field={oTime:'time',oWO:'workout',oFL:'fitLevel',oSkin:'skinType'}[id];
  singleSelect(id,attr,field);
});
markSelected();

if(load()){
  loadLook(); applyTheme();     // the profile may carry an older look; the keys win
  buildCats();
  document.getElementById('landing').style.display='none';
  document.body.classList.remove('has-sticky');
  document.getElementById('stickyCta').style.display='none';
  document.getElementById('app').style.display='block';
  document.body.classList.add('in-app');
  renderGoalOpts(); markSelected();
  startApp();
}
</script>

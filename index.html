ese","ing.lentils":"Lentils","ing.crackers":"Crackers","ing.hummus":"Hummus","r.eggtoast.n":"Egg and tomato toast","r.eggtoast.1":"Fry an egg in a little olive oil over medium heat.","r.eggtoast.2":"Toast the bread and lay tomato slices on it.","r.eggtoast.3":"Put the egg on top and season with salt and pepper.","r.shakshuka.n":"Simple shakshuka","r.shakshuka.1":"Soften chopped onion and pepper in a pan.","r.shakshuka.2":"Add chopped tomatoes and cook for 10 minutes.","r.shakshuka.3":"Crack eggs into the sauce and cover until they set.","r.shakshuka.4":"Serve with bread for dipping.","r.tunasalad.n":"Tuna and chickpea salad","r.tunasalad.1":"Drain the tuna and chickpeas into a bowl.","r.tunasalad.2":"Chop tomato, cucumber and onion and add them.","r.tunasalad.3":"Dress with olive oil and lemon, then mix.","r.pastagarlic.n":"Garlic olive-oil pasta","r.pastagarlic.1":"Cook the pasta as directed and keep a little of the water.","r.pastagarlic.2":"Warm sliced garlic in olive oil over low heat without browning it.","r.pastagarlic.3":"Toss the pasta with the garlic and a splash of the water.","r.pastagarlic.4":"Grate cheese over the top if you have some.","r.ricebowl.n":"Rice and vegetable bowl","r.ricebowl.1":"Cook the rice as directed.","r.ricebowl.2":"Fry chopped carrot, pepper and onion in olive oil.","r.ricebowl.3":"Mix everything together and squeeze over some lemon.","r.omelette.n":"Vegetable omelette","r.omelette.1":"Beat the eggs with a pinch of salt.","r.omelette.2":"Lightly fry mushrooms, spinach or whatever vegetable you have.","r.omelette.3":"Pour in the eggs, cook gently and fold.","r.oatmeal.n":"Warm oatmeal","r.oatmeal.1":"Cook oats in milk or water for about five minutes.","r.oatmeal.2":"Stir now and then so it does not stick.","r.oatmeal.3":"Top with banana, nuts or honey.","r.yogurtbowl.n":"Yoghurt and fruit bowl","r.yogurtbowl.1":"Spoon yoghurt into a bowl.","r.yogurtbowl.2":"Add chopped fruit and nuts.","r.yogurtbowl.3":"If you want it sweeter, drizzle a little honey.","r.wrap.n":"Chicken and veg wrap","r.wrap.1":"Warm the tortilla in a dry pan.","r.wrap.2":"Fill with chicken, greens, tomato and cucumber.","r.wrap.3":"Add a spoon of yoghurt and roll it up tightly.","r.bakedpotato.n":"Loaded baked potato","r.bakedpotato.1":"Prick the potato and bake it until soft.","r.bakedpotato.2":"Split it open and crumble cheese inside.","r.bakedpotato.3":"Add beans or tuna to make it a fuller meal.","r.chickpeasalad.n":"Chickpea and vegetable salad","r.chickpeasalad.1":"Drain the chickpeas into a bowl.","r.chickpeasalad.2":"Add finely chopped tomato, cucumber and onion.","r.chickpeasalad.3":"Dress with olive oil, lemon and salt.","r.pastaveg.n":"Tomato vegetable pasta","r.pastaveg.1":"Cook the pasta.","r.pastaveg.2":"Fry onion, garlic, courgette and pepper in olive oil.","r.pastaveg.3":"Add chopped tomatoes and cook until it thickens.","r.pastaveg.4":"Toss with the pasta and serve.","r.grilledcheese.n":"Grilled cheese","r.grilledcheese.1":"Put cheese between two slices of bread.","r.grilledcheese.2":"Add a slice of tomato if you like.","r.grilledcheese.3":"Toast in a pan until the cheese melts.","r.tofustir.n":"Tofu vegetable stir-fry","r.tofustir.1":"Pat the tofu dry and cut it into cubes.","r.tofustir.2":"Fry over high heat until golden.","r.tofustir.3":"Add pepper, carrot and garlic and keep going for two minutes.","r.tofustir.4":"Serve with rice.","r.beansrice.n":"Rice and beans","r.beansrice.1":"Fry onion and garlic until translucent.","r.beansrice.2":"Add the drained beans and warm them through.","r.beansrice.3":"Mix with cooked rice and season.","r.fruitsmooth.n":"Fruit smoothie","r.fruitsmooth.1":"Put banana, berries and milk or yoghurt in a blender.","r.fruitsmooth.2":"Blend until smooth.","r.fruitsmooth.3":"If it is too thick, add more liquid.","r.roastveg.n":"Roasted vegetables","r.roastveg.1":"Cut potato, carrot, courgette and pepper into similar-sized pieces.","r.roastveg.2":"Toss with olive oil, salt and garlic.","r.roastveg.3":"Roast until the edges brown.","r.avocadotoast.n":"Avocado toast","r.avocadotoast.1":"Toast two slices of bread.","r.avocadotoast.2":"Mash the avocado with a little lemon and salt.","r.avocadotoast.3":"Spread it on the bread and add sliced tomato.","r.scrambleveg.n":"Scrambled eggs with vegetables","r.scrambleveg.1":"Chop pepper and onion and soften them in olive oil.","r.scrambleveg.2":"Beat the eggs and pour them in.","r.scrambleveg.3":"Stir over low heat until set, then season.","r.cottagebowl.n":"Cottage cheese and fruit bowl","r.cottagebowl.1":"Spoon cottage cheese into a bowl.","r.cottagebowl.2":"Add chopped fruit and nuts.","r.cottagebowl.3":"Drizzle a little honey if you feel like it.","r.bananapancake.n":"Banana pancakes","r.bananapancake.1":"Mash a banana in a bowl and beat in two eggs.","r.bananapancake.2":"Add ground oats for a thicker batter.","r.bananapancake.3":"Pour small spoonfuls into a hot pan and flip after a minute.","r.lentilsoup.n":"Lentil soup","r.lentilsoup.1":"Fry onion, carrot and garlic in olive oil.","r.lentilsoup.2":"Add rinsed lentils and enough water to cover.","r.lentilsoup.3":"Simmer about 25 minutes until the lentils are soft.","r.lentilsoup.4":"Season and squeeze in lemon before serving.","r.chickenrice.n":"Chicken and rice bowl","r.chickenrice.1":"Cook the rice as directed.","r.chickenrice.2":"Cut the chicken into strips and fry with garlic until no longer pink inside.","r.chickenrice.3":"Add pepper and carrot for the last two minutes.","r.chickenrice.4":"Spoon it over the rice and squeeze lemon on top.","r.tunapasta.n":"Tuna tomato pasta","r.tunapasta.1":"Cook the pasta.","r.tunapasta.2":"Fry garlic in olive oil and add chopped tomatoes.","r.tunapasta.3":"Add drained tuna and warm it through for a minute.","r.tunapasta.4":"Toss with the pasta and squeeze in lemon.","r.pitastuff.n":"Stuffed pita","r.pitastuff.1":"Warm the pita and open it up.","r.pitastuff.2":"Spread hummus inside.","r.pitastuff.3":"Fill with hard-boiled egg or tuna, tomato and cucumber.","r.veggiesoup.n":"Vegetable soup","r.veggiesoup.1":"Chop onion, carrot, potato and courgette.","r.veggiesoup.2":"Soften them in olive oil, then cover with water.","r.veggiesoup.3":"Simmer for 20 minutes until everything is soft, then season.","r.hummusplate.n":"Hummus and vegetable plate","r.hummusplate.1":"Spoon hummus onto a plate.","r.hummusplate.2":"Cut carrot, cucumber and pepper into sticks.","r.hummusplate.3":"Drizzle olive oil over it and dip.","r.applenut.n":"Apple with nut butter","r.applenut.1":"Slice an apple.","r.applenut.2":"Spread nut butter on each slice.","r.applenut.3":"Scatter chopped nuts on top.","r.yogurthoney.n":"Yoghurt, honey and nuts","r.yogurthoney.1":"Put yoghurt in a glass or a bowl.","r.yogurthoney.2":"Drizzle honey and scatter nuts.","r.yogurthoney.3":"You can add berries or banana.","r.cheesecrackers.n":"Crackers, cheese and tomato","r.cheesecrackers.1":"Lay the crackers out on a plate.","r.cheesecrackers.2":"Put a slice of cheese on each one.","r.cheesecrackers.3":"Add sliced tomato and a little olive oil.","qz.t":"Let us see where you are","qz.s":"10 questions, about a minute. There are no right answers — just say what actually happens.","qz.count":"Question {n} of {t}","qz.prev":"Previous question","qz.notest":"This is not a test and not a diagnosis. It is a snapshot, and it changes the moment you start doing.","dim.init":"Initiative","dim.goal":"Goals","dim.time":"Time management","dim.solve":"Handling problems","dim.plan":"Planning ahead","rs.t":"Your profile","rs.s":"This is where you are today. Not where you stay.","rs.index":"Proactivity score","rs.mean":"What does this mean?","rs.try":"What to try next","rs.cta":"Alright, let us start","rs.again":"Answer again","rs.updated":"Profile updated","rs.ageband":"Your age has changed since you answered. If you like, retake it with questions that fit better.","rs.none":"You have not done the check-in yet. It takes a minute.","rs.b1":"Just starting","rs.b2":"Building momentum","rs.b3":"In control","rs.b4":"Leading yourself","rs.st.init":"when something matters to you, you do not wait to be told — you move","rs.st.goal":"you know where you want to get to, and that is already half the work","rs.st.time":"you know how to start on time instead of sprinting at the end","rs.st.solve":"when something jams, you look for a way through instead of freezing","rs.st.plan":"you think ahead, so fewer things catch you off guard","rs.gr.init":"sometimes you wait for someone else to move first","rs.gr.goal":"what you want is still in your head and not written anywhere","rs.gr.time":"things that do not feel urgent get pushed aside","rs.gr.solve":"when something does not work, dropping it feels easier than trying differently","rs.gr.plan":"the day starts before you know what the plan actually is","rs.line":"It looks like {strong}, but {grow}. That gap is the useful one to work on right now.","rs.ac.init.1":"Pick one thing this week you do without anyone asking","rs.ac.init.2":"Next time they need a volunteer — give yourself 3 seconds and raise your hand","rs.ac.init.3":"Send one message you have been putting off — to a friend, a teacher, anyone","rs.ac.goal.1":"Write one goal in one sentence, with a date","rs.ac.goal.2":"Break it into one step you can do today","rs.ac.goal.3":"At the end of the week look at it again and change what needs changing","rs.ac.time.1":"Take the task you have put off most and do 5 minutes of it. Just 5","rs.ac.time.2":"Give one task a fixed hour in your day","rs.ac.time.3":"Start with the least pleasant task — that is how it ends fastest","rs.ac.solve.1":"Next time you are stuck, give yourself 10 minutes alone before you drop it","rs.ac.solve.2":"Write down exactly what is not working. Often that is already half the answer","rs.ac.solve.3":"Something that failed — try it again with one small change","rs.ac.plan.1":"In the evening, write three things for tomorrow. No more","rs.ac.plan.2":"Pack your bag at night instead of in the morning","rs.ac.plan.3":"Pick one fixed day a week to look at the week ahead","ls.t":"Learn to be proactive","ls.s":"Short reads. Each one takes under a minute and ends with one thing you can do now.","ls.ex":"In real life","ls.do":"Do this now","ls.read":"30 seconds","ls.read2":"1 minute","ls.mk":"Mark as read","ls.done":"Read","ls.1.t":"What is proactive?","ls.1.b":"Being proactive is not being busy all day. It is noticing that you have a choice — and doing something with it, instead of waiting for someone to decide for you.","ls.1.e":"The teacher said there is a test \"soon\". The usual move: wait for a date. The proactive one: ask when, and open the material today.","ls.1.d":"Think of one thing you are waiting on right now. What step could you take without waiting?","ls.2.t":"Proactive vs reactive","ls.2.b":"Reactive = life happens to you and you respond. Proactive = you decide first and then act. Both people do roughly the same things — just in the opposite order.","ls.2.e":"Your phone runs out of space exactly when you need to film. Reactive: deleting in a panic. Proactive: cleared space last week.","ls.2.d":"Find one thing you know will blow up on you in a week. Give it five minutes today.","ls.3.t":"How to stop waiting for motivation","ls.3.b":"Motivation almost never shows up before the action. It shows up after. You do not need to wait until you feel like it — you start small, and the feeling catches up.","ls.3.e":"Nobody feels motivated to run in the rain. But two minutes into the run, stopping is the last thing you want.","ls.3.d":"Pick a task. Do two minutes of it without asking whether you feel like it.","ls.4.t":"How to start with no energy","ls.4.b":"When you have no energy, the problem is almost always the size of the task, not your energy. Shrink it until it looks ridiculous: not \"tidy my room\" but \"pick five things off the floor\".","ls.4.e":"Homework that looks like two hours. Just open the notebook and write the date. You usually will not stop there.","ls.4.d":"Take a big task you have postponed and write its smallest possible version. Then do that.","ls.5.t":"How to deal with procrastination","ls.5.b":"Procrastination is almost always escaping a feeling, not laziness: fear of failing, boredom, or simply not knowing where to start. Once the first step is small and clear, there is nothing to escape from.","ls.5.e":"An assignment you have to hand in. You avoid it for a week — not because it is hard, but because you have no idea where to start.","ls.5.d":"Write down the task you avoid most, then write next to it the very first line you could put in it.","ls.6.t":"How to set a goal that actually happens","ls.6.b":"A good goal answers three questions: what exactly, by when, and what is the first step. \"Get better at basketball\" is not a goal. \"Shoot 50 free throws three times a week until the end of the month\" is.","ls.6.e":"\"I want to get fit\" floats around for a year. \"Run 20 minutes on Tuesday and Thursday\" starts on Tuesday.","ls.6.d":"Take a goal you have in your head and add a number and a date to it.","ls.7.t":"How a goal turns into a habit","ls.7.b":"A habit forms when the action gets a fixed slot — same time, same place, right after the same thing. You stop having to decide every day, and that is exactly what saves the energy.","ls.7.e":"\"I will read when I have time\" does not happen. \"I read ten minutes right after brushing my teeth\" almost runs itself.","ls.7.d":"Pick one action and attach it to something you already do every day.","ls.8.t":"When something does not work out","ls.8.b":"Failing is information, not a verdict. The only question worth asking is \"what exactly did not work?\" — because that has an answer, and \"why am I like this\" does not.","ls.8.e":"You failed a test. \"I am bad at maths\" helps nobody. \"I studied only the night before and only the last page\" — that is something you can change.","ls.8.d":"Think of something that recently did not work, and write one sentence: what you will do differently next time.","ac.t":"Achievements","ac.s":"They unlock as you go. Nothing here to lose.","ac.got":"{n} of {t} unlocked","ac.locked":"Not yet","ac.new":"New achievement: {x}","ac.1.t":"First step","ac.1.d":"You closed one task","ac.2.t":"Three days running","ac.2.d":"You came back three days in a row","ac.3.t":"First goal","ac.3.d":"You set a goal of your own","ac.4.t":"You took initiative","ac.4.d":"You closed a daily challenge","ac.5.t":"You planned ahead","ac.5.d":"You hit a weekly target on the grid","ac.6.t":"You did not quit","ac.6.d":"You came back after the streak broke","ac.7.t":"Curious","ac.7.d":"You read three lessons","ac.8.t":"You know yourself","ac.8.d":"You completed the check-in","ac.9.t":"A full week","ac.9.d":"Seven days in a row","ac.10.t":"Ten tasks","ac.10.d":"You closed ten tasks","n.hero.word":"Proactive","n.hero.q1":"The difference between success and failure is the distance between ","n.hero.q2":"somebody should do this","n.hero.q3":" and ","n.hero.q4":"I am doing this","n.hero.q5":".","n.hero.def":"Proactive = noticing what can be done, taking responsibility, and starting to act instead of just waiting.","n.hero.a":"More doing, less watching.","n.hero.sub":"Proactivity helps you turn the things you want to do into things you actually do — one step at a time.","n.hero.cta":"Let us start","n.hero.cta2":"What even is being proactive?","n.hero.note":"No sign-up · No email · Everything stays on your device","n.hero.kicker":"Ages 13 to 120","n.def.t":"So what is it, actually?","n.def.b":"Being proactive is not waiting for someone to remind you, pressure you, or decide for you. It is noticing what you can do — and doing it.","n.def.re":"Reactive","n.def.pro":"Proactive","n.def.hint":"Exactly the same situations. Two different responses.","n.sc.1.t":"A test in a week","n.sc.1.r":"\"There is loads of time.\"","n.sc.1.p":"\"20 minutes today, and I am not panicking at the end.\"","n.s ls.1.b":"Être proacti{f|ve}, ce n'est pas être occupé{|e} toute la journée. C'est remarquer que tu as le choix — et en faire quelque chose, au lieu d'attendre qu'on décide pour toi.","ls.1.e":"La prof a dit qu'il y aurait un contrôle « bientôt ». Réflexe habituel : attendre la date. Réflexe proactif : demander quand, et ouvrir le cours aujourd'hui.","ls.1.d":"Pense à une chose que tu attends en ce moment. Quel pas peux-tu faire sans attendre ?","ls.2.t":"Proactif ou réactif","ls.2.b":"Réactif = la vie t'arrive dessus et tu réagis. Proactif = tu décides d'abord, puis tu agis. Les deux font à peu près les mêmes choses — dans l'ordre inverse.","ls.2.e":"Ton téléphone est plein pile quand tu dois filmer. Réactif : tu supprimes en panique. Proactif : tu avais fait de la place la semaine d'avant.","ls.2.d":"Trouve un truc qui va te retomber dessus dans une semaine. Donne-lui cinq minutes aujourd'hui.","ls.3.t":"Arrêter d'attendre la motivation","ls.3.b":"La motivation n'arrive presque jamais avant l'action. Elle arrive après. Tu n'as pas besoin d'attendre l'envie — commence petit, et l'envie suit.","ls.3.e":"Personne n'a envie de courir sous la pluie. Mais deux minutes après le départ, tu n'as plus envie de t'arrêter.","ls.3.d":"Choisis une tâche. Fais-en deux minutes sans te demander si tu en as envie.","ls.4.t":"Démarrer sans énergie","ls.4.b":"Quand tu n'as plus d'énergie, le problème est presque toujours la taille de la tâche, pas ton énergie. Réduis-la jusqu'à ce qu'elle paraisse ridicule : pas « ranger ma chambre » mais « ramasser cinq trucs par terre ».","ls.4.e":"Des devoirs qui ressemblent à deux heures. Ouvre juste le cahier et écris la date. En général tu ne t'arrêtes pas là.","ls.4.d":"Prends une grosse tâche repoussée et écris sa plus petite version. Puis fais-la.","ls.5.t":"Gérer la procrastination","ls.5.b":"La procrastination, c'est presque toujours fuir une émotion, pas de la paresse : peur d'échouer, ennui, ou juste ne pas savoir par où commencer. Dès que la première étape est petite et claire, il n'y a plus rien à fuir.","ls.5.e":"Un devoir à rendre. Tu l'évites une semaine — pas parce que c'est dur, mais parce que tu ne sais pas par où commencer.","ls.5.d":"Écris la tâche que tu évites le plus, puis à côté la toute première ligne que tu pourrais y écrire.","ls.6.t":"Fixer un objectif qui se réalise","ls.6.b":"Un bon objectif répond à trois questions : quoi exactement, pour quand, et quelle est la première étape. « Progresser au basket » n'est pas un objectif. « Tirer 50 lancers francs trois fois par semaine jusqu'à la fin du mois », si.","ls.6.e":"« Je veux me remettre en forme » traîne un an. « Courir 20 minutes mardi et jeudi » commence mardi.","ls.6.d":"Prends un objectif que tu as en tête et ajoute-lui un chiffre et une date.","ls.7.t":"Transformer un objectif en habitude","ls.7.b":"Une habitude se crée quand l'action a une place fixe — même heure, même endroit, juste après la même chose. Tu n'as plus à décider chaque jour, et c'est ça qui économise l'énergie.","ls.7.e":"« Je lirai quand j'aurai le temps » n'arrive jamais. « Je lis dix minutes après m'être brossé les dents » se fait presque tout seul.","ls.7.d":"Choisis une action et accroche-la à un truc que tu fais déjà chaque jour.","ls.8.t":"Quand ça ne marche pas","ls.8.b":"Échouer, c'est une info, pas un verdict. La seule question qui vaut : « qu'est-ce qui n'a pas marché, exactement ? » — parce qu'elle a une réponse, contrairement à « pourquoi je suis comme ça ».","ls.8.e":"Tu as raté un contrôle. « Je suis nul en maths » n'aide pas. « J'ai révisé la veille et seulement la dernière page » — ça, tu peux le changer.","ls.8.d":"Pense à un truc récemment raté et écris une phrase : ce que tu feras autrement.","ac.t":"Réussites","ac.s":"Ils se débloquent en avançant. Rien à perdre ici.","ac.got":"{n} sur {t} débloquées","ac.locked":"Pas encore","ac.new":"Nouvelle réussite : {x}","ac.1.t":"Premier pas","ac.1.d":"Tu as bouclé une tâche","ac.2.t":"Trois jours d n.sc.4.t":"Apprendre un truc nouveau","n.sc.4.r":"« Je m'y mettrai un jour. »","n.sc.4.p":"« Une vidéo aujourd'hui, puis 10 minutes de pratique. »","n.sc.5.t":"Ranger ta chambre","n.sc.5.r":"« Je le ferai quand on me le dira. »","n.sc.5.p":"« Cinq minutes maintenant, et personne n'a à demander. »","n.sc.6.t":"Se lancer dans un hobby","n.sc.6.r":"« Je n'ai pas le temps pour ça. »","n.sc.6.p":"« Une demi-heure samedi. On verra si ça me parle. »","n.sc.7.t":"Parler à quelqu'un","n.sc.7.r":"« Peut-être qu'il m'écrira en premier. »","n.sc.7.p":"« J'écris le message maintenant et je l'envoie. »","n.sc.8.t":"Un objectif perso","n.sc.8.r":"« Un jour ça arrivera. »","n.sc.8.p":"« Je l'ai écrit, daté, commencé. »","n.def.close":"Personne n'est proactif sur tout. Ce n'est pas nécessaire. Faire bouger un domaine suffit.","n.how.t":"Comment ça marche","n.how.1.t":"On voit où tu en es","n.how.1.d":"Dix questions courtes sur ta façon de gérer aujourd'hui. Environ une minute.","n.how.2.t":"Tu reçois un instantané","n.how.2.d":"Cinq domaines, sans note ni jugement. Juste tes forces et tes marges.","n.how.3.t":"Tu fais un pas","n.how.3.d":"Une petite tâche par jour, adaptée à toi. Pas une liste de vingt trucs.","n.pf1.t":"questions dans le point","n.pf2.t":"domaines dans ton profil","n.pf3.t":"langues complètes","n.fin.t":"Alors, c'est quoi ton premier pas ?","n.fin.sub":"Une minute, et tu sais où tu en es.","n.o.1.t":"Salut. Content de te voir.","n.o.1.s":"Trente secondes d'explication, puis on démarre.","n.o.1.p1":"On regarde comment tu gères aujourd'hui — dix questions courtes.","n.o.1.p2":"Tu obtiens un instantané perso, sans notes ni morale.","n.o.1.p3":"Puis on commence par un petit pas. Vraiment un seul.","n.o.1.go":"C'est parti","n.o.2.t":"Un peu sur toi","n.o.2.s":"Seulement ce qui aide vraiment à adapter. Pas d'inscription, pas d'e-mail.","n.o.2.name":"On t'appelle comment ?","n.o.2.nameph":"Prénom ou surnom (facultatif)","n.o.2.age":"Tu as quel âge ?","n.o.2.color":"Quelle couleur te va ?","n.o.2.colorn":"Tu peux en changer en haut à tout moment.","n.o.2.privacy":"On ne demande ni e-mail, ni téléphone, ni adresse. Tout reste dans ton navigateur.","n.o.3.t":"Tu veux améliorer quoi ?","n.o.3.s":"Choisis-en autant que tu veux. Modifiable plus tard.","n.o.3.time":"Combien de temps as-tu vraiment par jour ?","n.o.5.t":"Ton premier objectif","n.o.5.s":"Choisis un domaine, réponds à trois questions, et obtiens un objectif qui découle de tes réponses.","n.o.5.ph":"ex. progresser au basket","n.o.5.skip":"Rien pour l'instant — on continue","n.o.6.t":"Tu veux aussi un plan corps ?","n.o.6.s":"Facultatif. Tu peux passer et le régler plus tard dans l'onglet Corps.","n.o.6.skip":"Passer","n.o.6.finish":"Terminé — on y va","n.tab.home":"Accueil","n.tab.tasks":"Tâches","n.tab.prog":"Progrès","n.tab.learn":"Apprendre","n.nav.label":"Navigation principale","d.hi":"Salut {name} 👋","d.progress":"Mes progrès","d.streak":"Série","d.goals":"Objectifs actifs","d.done":"Tâches terminées","d.index":"Indice de proactivité","d.next":"Ton prochain pas","d.next.s":"Une chose. Pas une liste.","d.start5":"Je commence 5 minutes maintenant","d.mark":"C'est fait","d.running":"En cours · {t}","d.timeup":"Cinq minutes écoulées. Tu l'as fait.","d.allclear":"Tu as bouclé ton pas du jour. À demain.","d.profile":"Mon profil","d.seeall":"Toutes les tâches","d.focus":"Ce que tu vises","d.sk.0":"Aujourd'hui commence une nouvelle série.","d.sk.1":"Premier jour. Bien.","d.sk.n":"{n} jours d'affilée 🔥","d.sk.miss":"Tu as sauté un jour. Pas grave — on continue aujourd'hui.","n.tk.t":"Mes tâches","n.tk.s":"Tout est facultatif. Coche ce que tu as vraiment fait.","gl.goal":"Objectif","gl.week":"Cette semaine","gl.today":"Aujourd'hui","gl.now":"Maintenant","gl.now.btn":"Commencer maintenant","gl.wk.ph":"Tu fais quoi cette semaine ?","gl.td.ph":"Et aujourd'hui ?","gl.steps":"Étapes suggérées","gl.saved":"Enregistré","n.pg.t":"Mes progrès","n.pg.s":"Pas pour impressionner. Juste pour voir que ça bouge.","n.pg.week":"Tableau hebdo","n.empty.goals":"Pas encore d'objectif. Écris-en un, on le découpe ensemble.","seo.title":"Proactivity — arrête de repousser, commence à faire","seo.desc":"Être proactif, ça veut dire quoi et comment le devenir ? Un point rapide, adapté à l'âge, montre où en sont l'initiative, les objectifs, le temps et l'anticipation — puis un objectif construit à partir de tes réponses, des petits pas et des habitudes qui tiennent. À partir de 13 ans, sans inscription.","ab.a13":"Questions pour 13–17 ans","ab.a18":"Questions pour 18–29 ans","ab.a30":"Questions pour 30–49 ans","ab.a50":"Questions pour 50 ans et plus","pf.t":"Mes infos","pf.s":"Ton âge décide des questions et des plans que tu reçois ; la forme d'adresse, de la façon dont le site te parle.","n.o.2.gender":"Comment s'adresser à toi ?","n.o.2.gendern":"Ça définit seulement la façon dont le site te parle. Modifiable quand tu veux.","qz.a13.1.q":"Tu as un contrôle dans une semaine. Il se passe quoi, en général ?","qz.a13.1.a":"Je commence à réviser quelques jours avant","qz.a13.1.b":"Je me dis qu'il reste plein de temps","qz.a13.1.c":"Je m'en souviens la veille au soir","qz.a13.1.d":"Ça dépend de l'importance de la matière","qz.a13.2.q":"On cherche un volontaire pour un projet en classe. Tu fais quoi ?","qz.a13.2.a":"Je lève la main","qz.a13.2.b":"J'attends de voir qui se propose","qz.a13.2.c":"J'espère qu'on ne me choisira pas","qz.a13.2.d":"Ça dépend si le sujet m'intéresse","qz.a13.3.q":"Il y a un truc que tu veux réussir. Ça ressemble à quoi, là ?","qz.a13.3.a":"Écrit quelque part, avec une date","qz.a13.3.b":"Je sais à peu près quoi et quand","qz.a13.3.c":"C'est seulement dans ma tête","qz.a13.3.d":"Je n'ai rien de clair en ce moment","qz.a13.4.q":"Ton sac et ta chambre — c'est comment ?","qz.a13.4.a":"Rangé, je sais où est chaque chose","qz.a13.4.b":"Correct, parfois ça part en vrille","qz.a13.4.c":"Le bazar, mais je m'y retrouve","qz.a13.4.d":"Je cherche mes affaires c rs.gr.goal":"то, чего ты хочешь, всё ещё в голове и нигде не записано","rs.gr.time":"то, что не кажется срочным, отодвигается в сторону","rs.gr.solve":"когда что-то не выходит, бросить кажется проще, чем попробовать иначе","rs.gr.plan":"день начинается раньше, чем ты понимаешь, каков план","rs.line":"Похоже, {strong}, но {grow}. Именно этот разрыв сейчас имеет смысл закрывать.","rs.ac.init.1":"Выбери одно дело на этой неделе, которое сделаешь без просьбы","rs.ac.init.2":"В следующий раз, когда ищут добровольца — дай себе 3 секунды и подними руку","rs.ac.init.3":"Отправь одно сообщение, которое откладывал — другу, учителю, кому угодно","rs.ac.goal.1":"Запиши одну цель в одном предложении, со сроком","rs.ac.goal.2":"Разбей её на один шаг, который можно сделать сегодня","rs.ac.goal.3":"В конце недели посмотри на неё снова и поменяй, что нужно","rs.ac.time.1":"Возьми задачу, которую откладывал дольше всего, и сделай 5 минут. Только 5","rs.ac.time.2":"Назначь одной задаче постоянное время в дне","rs.ac.time.3":"Начни с самой неприятной задачи — так она закончится быстрее всего","rs.ac.solve.1":"В следующий раз, когда застрянешь, дай себе 10 минут наедине, прежде чем бросить","rs.ac.solve.2":"Запиши, что именно не работает. Часто это уже половина решения","rs.ac.solve.3":"То, что не вышло — попробуй снова с одним небольшим изменением","rs.ac.plan.1":"Вечером запиши три дела на завтра. Не больше","rs.ac.plan.2":"Собери рюкзак вечером, а не утром","rs.ac.plan.3":"Выбери один постоянный день в неделю, чтобы посмотреть на следующую","ls.t":"Учимся быть проактивным","ls.s":"Короткие тексты. Каждый меньше минуты и заканчивается одним делом на сейчас.","ls.ex":"В реальной жизни","ls.do":"Сделай это сейчас","ls.read":"30 секунд","ls.read2":"1 минута","ls.mk":"Отметить прочитанным","ls.done":"Прочитано","ls.1.t":"Что такое проактивность?","ls.1.b":"Быть проактивным — не значит быть занятым весь день. Это заметить, что у тебя есть выбор, и что-то с ним сделать, вместо того чтобы ждать, пока решат за тебя.","ls.1.e":"Учитель сказал, что скоро контрольная. Обычная реакция — ждать даты. Проактивная — спросить когда и открыть материал сегодня.","ls.1.d":"Подумай об одном деле, которого ты сейчас ждёшь. Какой шаг ты можешь сделать, не дожидаясь?","ls.2.t":"Проактивный или реактивный","ls.2.b":"Реактивный — жизнь случается с тобой, и ты реагируешь. Проактивный — ты сначала решаешь, потом действуешь. Оба делают примерно одно и то же, только в обратном порядке.","ls.2.e":"Память в телефоне кончилась ровно тогда, когда надо снимать. Реактивно — удалять в панике. Проактивно — освободил место на прошлой неделе.","ls.2.d":"Найди одно дело, которое рванёт через неделю. Дай ему пять минут сегодня.","ls.3.t":"Как перестать ждать мотивацию","ls.3.b":"Мотивация почти никогда не приходит до действия. Она приходит после. Не нужно ждать желания — начни с малого, и желание догонит.","ls.3.e":"Никто не хочет бежать под дождём. Но через две минуты бега остановиться уже не хочется.","ls.3.d":"Выбери задачу. Сделай две минуты, не спрашивая, хочется ли.","ls.4.t":"Как начать без сил","ls.4.b":"Когда нет сил, проблема почти всегда в размере задачи, а не в твоих силах. Уменьши её до смешного: не «убрать комнату», а «поднять пять вещей с пола».","ls.4.e":"Домашка, которая выглядит на два часа. Просто открой тетрадь и напиши дату. Обычно на этом ты не остановишься.","ls.4.d":"Возьми большую отложенную задачу и запиши её минимальную версию. И сделай именно её.","ls.5.t":"Что делать с прокрастинацией","ls.5.b":"Прокрастинация — почти всегда бегство от чувства, а не лень: страх провала, скука или просто непонятно, с чего начать. Как только первый шаг мал и ясен, бежать не от чего.","ls.5.e":"Работа, которую надо сдать. Ты избегаешь её неделю — не потому что сложно, а потому что непонятно, с чего начать.","ls.5.d":"Запиши задачу, которую избегаешь больше всего, а рядом — самую первую строчку, которую в ней можно написать.","ls.6.t":"Как поставить цель, которая случится","ls.6.b":"Хорошая цель отвечает на три вопроса: что именно, к какому сроку и какой первый шаг. «Стать лучше в баскетболе» — не цель. «Бросать 50 штрафных три раза в неделю до конца месяца» — цель.","ls.6.e":"«Хочу быть в форме» висит в воздухе год. «Бегать 20 минут во вторник и четверг» начинается во вторник.","ls.6.d":"Возьми цель, что у тебя в голове, и добавь к ней число и дату.","ls.7.t":"Как цель становится привычкой","ls.7.b":"Привычка складывается, когда у действия есть постоянное место — то же время, то же место, сразу после того же события. Не нужно решать заново каждый день — именно это и экономит силы.","ls.7.e":"«Почитаю, когда будет время» не случается. «Читаю десять минут сразу после чистки зубов» работает почти само.","ls.7.d":"Выбери одно действие и привяжи его к тому, что ты и так делаешь каждый день.","ls.8.t":"Когда что-то не получается","ls.8.b":"Провал — это информация, а не приговор. Единственный стоящий вопрос: «что именно не сработало?» — на него есть ответ, а на «почему я такой» — нет.","ls.8.e":"Ты завалил контрольную. «Я плох в математике» не помогает. «Я готовился только накануне и только по последней странице» — вот это можно изменить.","ls.8.d":"Вспомни то, что недавно не вышло, и напиши одно предложение: что сделаешь иначе.","ac.t":"Достижения","ac.s":"Открываются по ходу. Здесь нечего терять.","ac.got":"Открыто {n} из {t}","ac.locked":"Пока нет","ac.new":"Новое достижение: {x}","ac.1.t":"Первый шаг","ac.1.d":"Ты закрыл одну задачу","ac.2.t":"Три дня подряд","ac.2.d":"Ты возвращался три дня подряд","ac.3.t":"Первая цель","ac.3.d":"Ты поставил свою цель","ac.4.t":"Ты проявил инициативу","ac.4.d":"Ты закрыл вызов дня","ac.5.t":"Ты спланировал заранее","ac.5.d":"Ты закрыл недельную цель","ac.6.t":"Ты не сдался","ac.6.d":"Ты вернулся после сорванной серии","ac.7.t":"Любознательный","ac.7.d":"Ты прочитал три урока","ac.8.t":"Знаешь себя","ac.8.d":"Ты прошёл чек-ин","ac.9.t":"Целая неделя","ac.9.d":"Семь дней подряд","ac.10.t":"Десять задач","ac.10.d":"Ты закрыл десять задач","n.hero.word":"Проактивный","n.hero.q1":"Разница между успехом и провалом — это расстояние между ","n.hero.q2":"кто-то должен это сделать","n.hero.q3":" и ","n.hero.q4":"я это делаю","n.hero.q5":".","n.hero.def":"Проактивный = заметить, что можно сделать, взять ответственность и начать действовать, а не просто ждать.","n.hero.a":"Больше инициативы, меньше наблюдения.","n.hero.sub":"Proactivity помогает превратить то, что ты хочешь сделать, в реальные действия — по шагу за раз.","n.hero.cta":"Начнём","n.hero.cta2":"А что вообще такое проактивность?","n.hero.note":"Без регистрации · Без почты · Всё остаётся на твоём устройстве","n.hero.kicker":"От 13 до 120 лет","n.def.t":"Так что это, если по-простому?","n.def.b":"Проактивность — это не ждать, пока напомнят, надавят или решат за тебя. Это заметить, что ты можешь сделать, — и сделать.","n.def.re":"Реактивно","n.def.pro":"Проактивно","n.def.hint":"Ровно те же ситуации. Две разные реакции.","n.sc.1.t":"Контрольная через неделю","n.sc.1.r":"«Времени ещё полно.»","n.sc.1.p":"«20 минут сегодня — и не паникую в конце.»","n.sc.2.t":"Тренировка","n.sc.2.r":"«Пойду, когда захочется.»","n.sc.2.p":"«Вторник и четверг в шесть. Уже решено.»","n.sc.3.t":"Школьный проект","n.sc.3.r":"«Подожду, посмотрю, что делают остальные.»","n.sc.3.p":"«Сегодня записываю тему и делю части.»","n.sc.4.t":"Учиться чему-то новому","n.sc.4.r":"«Когда-нибудь начну.»","n.sc.4.p":"«Одно видео сегодня, потом 10 минут практики.»","n.sc.5.t":"Убраться в комнате","n.sc.5.r":"«Уберусь, когда скажут.»","n.sc.5.p":"«Пять минут сейчас — и никому не надо просить.»","n.sc.6.t":"Начать хобби","n.sc.6.r":"«У меня нет на это времени.»","n.sc.6.p":"«Полчаса в субботу. Посмотрим, зайдёт ли.»","n.sc.7.t":"Поговорить с кем-то","n.sc.7.r":"«Может, он напишет первым.»","n.sc.7.p":"«Пишу сообщение сейчас и отправляю.»","n.sc.8.t":"Личная цель","n.sc.8.r":"«Однажды это случится.»","n.sc.8.p":"«Записал, поставил дату, начал.»","n.def.close":"Никто не проактивен во всём. И не нужно. Достаточно сдвинуть одну область.","n.how.t":"Как это работает","n.how.1.t":"Смотрим, где ты сейчас","n.how.1.d":"Десять коротких вопросов о том, как ты справляешься сейчас. Около минуты.","n.how.2.t":"Получаешь картину","n.how.2.d":"Пять областей, без оценок и осуждения. Только где ты силён и где есть место.","n.how.3.t":"Делаешь один шаг","n.how.3.d":"Одна маленькая задача в день, подходящая тебе. Не список из двадцати дел.","n.pf1.t":"вопросов в чек-ине","n.pf2.t":"областей в твоём профиле","n.pf3.t":"полных языков","n.fin.t":"Так какой твой первый шаг?","n.fin.sub":"Одна минута — и ты знаешь, где ты.","n.o.1.t":"Привет. Хорошо, что зашёл.","n.o.1.s":"Тридцать секунд объяснений — и начинаем.","n.o.1.p1":"Посмотрим, как ты справляешься сейчас — десять коротких вопросов.","n.o.1.p2":"Получишь личную картину — без оценок и нравоучений.","n.o.1.p3":"А потом начнём с одного маленького шага. Правда одного.","n.o.1.go":"Поехали","n.o.2.t":"Немного о тебе","n.o.2.s":"Только то, что реально помогает подстроить. Без регистрации и почты.","n.o.2.name":"Как к тебе обращаться?","n.o.2.nameph":"Имя или ник (необязательно)","n.o.2.age":"Сколько тебе лет?","n.o.2.color":"Какой цвет тебе подходит?","n.o.2.colorn":"Можно поменять в любой момент наверху.","n.o.2.privacy":"Мы не просим почту, телефон или адрес. Всё хранится только в твоём браузере.","n.o.3.t":"Что хочешь улучшить?","n.o.3.s":"Выбери сколько хочешь. Потом можно изменить.","n.o.3.time":"Сколько времени у тебя реально есть в день?","n.o.5.t":"Твоя первая цель","n.o.5.s":"Выбери область, ответь на три вопроса — и получи цель, которая следует из твоих ответов.","n.o.5.ph":"например: подтянуть баскетбол","n.o.5.skip":"Пока ничего — дальше","n.o.6.t":"Хочешь ещё план для тела?","n.o.6.s":"Необязательно. Можно пропустить и настроить позже во вкладке «Тело».","n.o.6.skip":"Пропустить","n.o.6.finish":"Готово — веди внутрь","n.tab.home":"Главная","n.tab.tasks":"Задачи","n.tab.prog":"Прогре .b":"المتفاعل: تحدث لك الحياة {فتستجيب|فتستجيبين}. المبادر: {تقرّر|تقرّرين} أولاً ثم {تتصرّف|تتصرّفين}. كلاهما يفعل الأشياء نفسها تقريباً — لكن بترتيب معكوس.","ls.2.e":"تمتلئ ذاكرة هاتفك بالضبط حين تحتاج للتصوير. المتفاعل: يحذف في ذعر. المبادر: أفرغ مساحة الأسبوع الماضي.","ls.2.d":"{ابحث|ابحثي} عن شيء {تعرف|تعرفين} أنه سينفجر عليك بعد أسبوع. {امنحه|امنحيه} خمس دقائق اليوم.","ls.3.t":"كيف تتوقّف عن انتظار الحماس","ls.3.b":"الحماس لا يأتي قبل الفعل تقريباً أبداً. يأتي بعده. لست بحاجة لانتظار الرغبة — {ابدأ|ابدئي} بصغير، وستلحق بك الرغبة.","ls.3.e":"لا أحد يشعر بالحماس للركض تحت المطر. لكن بعد دقيقتين من الركض، آخر ما تريده هو التوقّف.","ls.3.d":"{اختر|اختاري} مهمة. {افعل|افعلي} منها دقيقتين دون أن {تسأل|تسألي} إن كنت {ترغب|ترغبين}.","ls.4.t":"كيف تبدأ وأنت بلا طاقة","ls.4.b":"حين لا تملك طاقة، المشكلة غالباً حجم المهمة لا طاقتك. صغّرها حتى تبدو سخيفة: ليس «رتّب غرفتي» بل «التقط خمسة أشياء عن الأرض».","ls.4.e":"واجب يبدو وكأنه ساعتان. افتح الدفتر فقط واكتب التاريخ. عادةً لن تتوقّف عند هذا.","ls.4.d":"{خذ|خذي} مهمة كبيرة أجّلتها {واكتب|واكتبي} أصغر نسخة منها. ثم {افعلها|افعليها}.","ls.5.t":"كيف تتعامل مع التسويف","ls.5.b":"التسويف غالباً هروب من شعور لا كسل: خوف من الفشل، ملل، أو ببساطة عدم وضوح البداية. حين تكون الخطوة الأولى صغيرة وواضحة، لا يبقى ما تهرب منه.","ls.5.e":"مهمة عليك تسليمها. {تتجنّبها|تتجنّبينها} أسبوعاً — لا لأنها صعبة، بل لأنك لا {تعرف|تعرفين} من أين {تبدأ|تبدئين}.","ls.5.d":"{اكتب|اكتبي} المهمة التي {تتجنّبها|تتجنّبينها} أكثر، ثم {اكتب|اكتبي} بجانبها أول سطر يمكنك كتابته فيها.","ls.6.t":"كيف تضع هدفاً يتحقّق فعلاً","ls.6.b":"الهدف الجيد يجيب على ثلاثة أسئلة: ماذا بالضبط، ومتى، وما الخطوة الأولى. «أتحسّن في كرة السلة» ليس هدفاً. «أسدّد 50 رمية حرة ثلاث مرات أسبوعياً حتى نهاية الشهر» هدف.","ls.6.e":"«أريد أن أصبح لائقاً» يبقى معلّقاً سنة. «أركض 20 دقيقة الثلاثاء والخميس» يبدأ يوم الثلاثاء.","ls.6.d":"{خذ|خذي} هدفاً في رأسك {وأضف|وأضيفي} إليه رقماً وتاريخاً.","ls.7.t":"كيف يتحوّل الهدف إلى عادة","ls.7.b":"تتكوّن العادة حين يحصل الفعل على مكان ثابت — الوقت نفسه، المكان نفسه، بعد الشيء نفسه. لن {تضطر|تضطري} للقرار كل يوم، وهذا بالضبط ما يوفّر الطاقة.","ls.7.e":"«سأقرأ حين يتوفّر الوقت» لا يحدث. «أقرأ عشر دقائق بعد تنظيف أسناني» يحدث تقريباً من تلقاء نفسه.","ls.7.d":"{اختر|اختاري} فعلاً واحداً {واربطه|واربطيه} بشيء {تفعله|تفعلينه} يومياً أصلاً.","ls.8.t":"حين لا ينجح شيء","ls.8.b":"الإخفاق معلومة لا حكم. السؤال الوحيد الذي يستحق: «ما الذي لم ينجح بالضبط؟» — لأن له إجابة، بخلاف «لماذا أنا هكذا».","ls.8.e":"أخفقت في امتحان. «أنا سيئ في الرياضيات» لا يفيد. «ذاكرت في الليلة السابقة فقط والصفحة الأخيرة فقط» — هذا شيء يمكن تغييره.","ls.8.d":"{فكّر|فكّري} بشيء لم ينجح مؤخراً، {واكتب|واكتبي} جملة واحدة: ما الذي {ستفعله|ستفعلينه} بشكل مختلف.","ac.t":"الإنجازات","ac.s":"تُفتح أثناء تقدّمك. لا شيء تخسره هنا.","ac.got":"فُتح {n} من {t}","ac.locked":"ليس بعد","ac.new":"إنجاز جديد: {x}","ac.1.t":"الخطوة الأولى","ac.1.d":"أنهيت مهمة واحدة","ac.2.t":"ثلاثة أيام متتالية","ac.2.d":"عدت ثلاثة أيام متتالية","ac.3.t":"الهدف الأول","ac.3.d":"وضعت هدفاً خاصاً بك","ac.4.t":"بادرت بشيء","ac.4.d":"أنهيت تحدي اليوم","ac.5.t":"خطّطت مسبقاً","ac.5.d":"حققت هدفاً أسبوعياً في الجدول","ac.6.t":"لم تستسلم","ac.6.d":"عدت بعد انقطاع السلسلة","ac.7.t":"فضولي","ac.7.d":"قرأت ثلاثة دروس","ac.8.t":"تعرف نفسك","ac.8.d":"أكملت الاستبيان","ac.9.t":"أسبوع كامل","ac.9.d":"سبعة أيام متتالية","ac.10.t":"عشر مهام","ac.10.d":"أنهيت عشر مهام","n.hero.word":"مبادر","n.hero.q1":"الفرق بين النجاح والفشل هو المسافة بين ","n.hero.q2":"يجب على أحدهم أن يفعل هذا","n.hero.q3":" و","n.hero.q4":"أنا أفعل هذا","n.hero.q5":".","n.hero.def":"مبادر = أن ترى ما يمكن فعله، وتتحمّل المسؤولية، وتبدأ بالفعل بدل مجرد الانتظار.","n.hero.a":"مبادرة أكثر، ومشاهدة أقل.","n.hero.sub":"يساعدك Proactivity على تحويل ما تريد فعله إلى أفعال حقيقية — خطوة واحدة في كل مرة.","n.hero.cta":"هيا نبدأ","n.hero.cta2":"ما هي المبادرة أصلاً؟","n.hero.note":"بلا تسجيل · بلا بريد · كل شيء يبقى على جهازك","n.hero.kicker":"من 13 إلى 120 عاماً","n.def.t":"إذاً، ما هذا فعلاً؟","n.def.b":"المبادرة ليست انتظار من /* ================= i18n runtime ================= */
var LANGS=['he','en','fr','ru','ar'], RTL={he:1,ar:1};
var cur = (function(){ try{var s=localStorage.getItem('proactive_lang');
  if(s&&I18N[s])return s;}catch(e){}
  var n=(navigator.language||'he').slice(0,2); return I18N[n]?n:'he'; })();

/* Grammatical gender lives INSIDE the string as {masculine|feminine} rather than
   in a parallel set of keys: '{אתה|את} {מתחיל|מתחילה}', 'בחר{|י}', 'prêt{|e}',
   'выбрал{|а}'. One string per key, so the two forms can never drift apart, and
   English simply contains no segments.

   ORDER MATTERS, and it is the opposite of what looks natural. Gender resolves
   FIRST, on the raw string straight out of the table, and only then are
   {placeholder} values substituted in. Several call sites pass text the user
   typed - a name, a goal title, a custom category - and if gender ran last, a
   user who typed "{a|b}" would have one of their own branches silently deleted.
   Resolving first is safe because a branch may not contain a brace, so no
   placeholder can ever hide inside one.

   Never resolve anywhere but here. esc() does not escape braces, so running
   this over an already-assembled HTML string could let one match span an
   attribute boundary. On the raw table string, before interpolation, it cannot. */
var GSEG=/\{([^{}|]*)\|([^{}|]*)\}/g;
var GENDERS=['m','f','n'];
var gnd=(function(){ try{
  var g=localStorage.getItem('proactive_gender');
  return GENDERS.indexOf(g)>=0 ? g : '';
}catch(e){ return ''; } })();

/* Hebrew and Arabic have no neutral second person. When the user has not said,
   the honest render is the slash form Israeli interfaces actually use -
   מתחיל/ה, בחר/י - built by keeping the shared prefix and appending only the
   part that differs. */
function gmerge(m,f){
  if(m===f) return m;
  if(!m) return f;
  if(!f) return m;
  var i=0;
  while(i<m.length && i<f.length && m.charAt(i)===f.charAt(i)) i++;
  var tail=f.slice(i);
  return (i>0 && tail && tail.length<=2) ? m+'/'+tail : m+'/'+f;
}
function gres(s){
  if(s.indexOf('|')<0) return s;
  return s.replace(GSEG, function(_,m,f){
    return gnd==='f' ? f : gnd==='m' ? m : gmerge(m,f);
  });
}
function t(k,vars){
  var s=(I18N[cur]&&I18N[cur][k]);
  if(s===undefined) s=(I18N.he&&I18N.he[k]);
  if(s===undefined) return k;
  s=gres(s);
  if(vars) for(var v in vars) s=s.split('{'+v+'}').join(vars[v]);
  return s;
}
function esc(s){var d=document.createElement('div');d.textContent=String(s==null?'':s);return d.innerHTML;}
function ic(n,cls){return '<svg class="ic'+(cls?' '+cls:'')+'" aria-hidden="true"><use href="#i-'+n+'"></use></svg>';}

function applyLang(){
  var dir = RTL[cur] ? 'rtl' : 'ltr';
  document.documentElement.lang = cur;
  document.documentElement.dir  = dir;
  document.querySelectorAll('.langbtn').forEach(function(b){ b.classList.toggle('on', b.dataset.lang===cur); });
  document.querySelectorAll('[data-i18n]').forEach(function(el){ el.textContent = t(el.dataset.i18n); });
  document.querySelectorAll('[data-i18n-html]').forEach(function(el){ el.innerHTML = t(el.dataset.i18nHtml); });
  document.querySelectorAll('[data-i18n-ph]').forEach(function(el){ el.placeholder = t(el.dataset.i18nPh); });
  document.querySelectorAll('[data-i18n-title]').forEach(function(el){
    var s=t(el.dataset.i18nTitle); el.title=s; el.setAttribute('aria-label',s);
  });
  var mb=document.getElementById('modeBtn');
  if(mb) mb.setAttribute('data-i18n-title', activeTheme()==='light' ? 'th.dark' : 'th.light');
  document.title = t('seo.title');
  var md=document.querySelector('meta[name="description"]');
  if(md) md.setAttribute('content', t('seo.desc'));
  renderPrices();
  renderCheckout();
}

   path rather than each remembering its own list of things to repaint. */

  applyLang();
  if(document.getElementById('app').style.display==='block') startApp();

}

}

  if(GENDERS.indexOf(g)<0) return;

}

var QBANDS=['a13','a18','a30','a50'];
function ageBand(a){
  var n=Number(a);
  if(!n || n<13) return 'a13';
  if(n<=17) return 'a13';
  if(n<=29) return 'a18';
  if(n<=49) return 'a30';
  return 'a50';
}

   so none of the plan literals change); x scales HOW MUCH. Splitting them is
   what lets the plan serve a 70-year-old: 'young' is already the low-impact
   branch - knee push-ups, table rows, static lunges, fast squats instead of
   burpees - which is the right regression for a deconditioned older body, not
   just for a small one. A 13-18 year old gets exactly what they got before. */
function fitProfile(age){
  var a=Math.min(120, Math.max(13, Number(age)||15));
  if(a<=14) return {variant:'young', x:0.70, noteKey:'wo.n.a13', bandKey:'fb.a13'};
  if(a<=17) return {variant:'mid',   x:0.90, noteKey:'wo.n.a15', bandKey:'fb.a15'};
  if(a<=29) return {variant:'older', x:1.00, noteKey:'wo.n.a18', bandKey:'fb.a18'};
  if(a<=49) return {variant:'older', x:0.95, noteKey:'wo.n.a30', bandKey:'fb.a30'};
  if(a<=64) return {variant:'mid',   x:0.85, noteKey:'wo.n.a50', bandKey:'fb.a50'};
  return             {variant:'young', x:0.60, noteKey:'wo.n.a65', bandKey:'fb.a65'};
}

/* ================= dimensions ================= */
var DIMS=[
 {id:'init', k:'dim.init',  icon:'rocket',   em:'🚀'},
 {id:'goal', k:'dim.goal',  icon:'target',   em:'🎯'},
 {id:'time', k:'dim.time',  icon:'clock',    em:'⏱️'},
 {id:'solve',k:'dim.solve', icon:'brain',    em:'🧠'},
 {id:'plan', k:'dim.plan',  icon:'calendar', em:'📅'}
];
function dimById(id){ for(var i=0;i<DIMS.length;i++) if(DIMS[i].id===id) return DIMS[i]; return DIMS[0]; }

/* Ten questions, two per dimension. The four numbers are what each answer is
   worth, in the option order a-b-c-d. They are not a grade - they only decide
   which area the app leans on when it suggests something. */
var QUESTIONS=[
 {n:1,  dim:'time',  v:[100,40,15,60]},
 {n:2,  dim:'init',  v:[100,55,20,70]},
 {n:3,  dim:'goal',  v:[100,60,35,15]},
 {n:4,  dim:'plan',  v:[95,65,35,15]},
 {n:5,  dim:'solve', v:[95,65,25,15]},
 {n:6,  dim:'init',  v:[100,60,30,15]},
 {n:7,  dim:'goal',  v:[100,70,40,20]},
 {n:8,  dim:'plan',  v:[100,65,35,15]},
 {n:9,  dim:'solve', v:[100,65,40,15]},
 {n:10, dim:'time',  v:[100,80,30,15]}
];
var QLETTERS=['a','b','c','d'];

/* Question text is looked up per age band. This probes I18N.he rather than
   t(), because t() returns the key on a miss and so cannot say "missing"; and a
   key present in I18N.he is present in all five languages, since build.py
   rejects any key with fewer. The fallback to a13 is belt and braces - build.py
   already fails on a band with a hole in it. */
function qk(band,n,part){
  var k='qz.'+band+'.'+n+'.'+part;
  return (I18N.he && I18N.he[k]!==undefined) ? k : 'qz.a13.'+n+'.'+part;
}
function quizBand(){ return ageBand(P.age); }

/* band records which wording the answers were given against. The scores stay
   valid across bands - question number -> dimension -> score vector does not
   depend on wording - so a changed age never throws a profile away; it only
   offers a retake. */
function emptyQuiz(){ return {answers:{}, scores:null, i:0, done:false, band:null}; }

/* ================= scoring ================= */
function scoreQuiz(){
  var q=S.quiz||emptyQuiz(), sum={}, count={};
  DIMS.forEach(function(d){ sum[d.id]=0; count[d.id]=0; });
  QUESTIONS.forEach(function(Q){
    var pick=q.answers[Q.n];
    var idx=QLETTERS.indexOf(pick);
    if(idx<0) return;
    sum[Q.dim]+=Q.v[idx]; count[Q.dim]++;
  });
  var out={};
  DIMS.forEach(function(d){
    out[d.id]= count[d.id] ? Math.round(sum[d.id]/count[d.id]) : 0;
  });
  return out;
}
function quizAnswered(){
  var q=S.quiz||{}, n=0;
  QUESTIONS.forEach(function(Q){ if(q.answers && q.answers[Q.n]) n++; });
  return n;
}
function hasProfile(){ return !!(S.quiz && S.quiz.scores); }
function profileIndex(){
  if(!hasProfile()) return 0;
  var t=0; DIMS.forEach(function(d){ t+=S.quiz.scores[d.id]||0; });
  return Math.round(t/DIMS.length);
}
function bandKey(v){ return v>=80?'rs.b4' : v>=65?'rs.b3' : v>=40?'rs.b2' : 'rs.b1'; }

/* Ties resolve by DIMS order rather than by whichever key the engine happens to
   walk first, so the same answers always produce the same profile text. */
function extremeDim(want){
  if(!hasProfile()) return DIMS[0].id;
  var best=DIMS[0].id, bv=S.quiz.scores[DIMS[0].id]||0;
  DIMS.forEach(function(d){
    var v=S.quiz.scores[d.id]||0;
    if(want==='high' ? v>bv : v<bv){ bv=v; best=d.id; }
  });
  return best;
}
function strongDim(){ return extremeDim('high'); }
function weakDim(){ return extremeDim('low'); }

/* The check-in is also what sets the challenge level, so someone who is
   already organised is not handed beginner-sized tasks and someone who is
   drowning is not handed a wall of them. */
function applyProfileToPlan(){
  var v=profileIndex();
  P.diff = v>=72 ? 'hard' : v>=45 ? 'mid' : 'easy';
}

/* ================= the check-in screen ================= */
function quizOptionRow(Q,letter,i){
  var chosen = (S.quiz.answers[Q.n]===letter);
  return '<button class="qz-opt'+(chosen?' on':'')+'" type="button" data-qa="'+letter+'" '+
    'aria-pressed="'+(chosen?'true':'false')+'">'+
    '<span class="qz-let" aria-hidden="true">'+letter.toUpperCase()+'</span>'+
    '<span class="qz-tx">'+esc(t(qk(quizBand(),Q.n,letter)))+'</span>'+
    '<span class="qz-tick" aria-hidden="true">'+ic('check')+'</span></button>';
}
function renderQuiz(){
  if(!S.quiz) S.quiz=emptyQuiz();
  var i=Math.min(Math.max(0,S.quiz.i),QUESTIONS.length-1);
  S.quiz.i=i;
  var Q=QUESTIONS[i], total=QUESTIONS.length;

  var count=document.getElementById('qzCount');
  if(count) count.textContent=t('qz.count',{n:i+1,t:total});
  var bar=document.getElementById('qzBar');
  if(bar){ bar.style.width=Math.round((i+1)/total*100)+'%'; }
  /* The overlay header keeps showing where the user is in SETUP; the question
     counter lives inside the card. Printing the question count in both places
     read as two different progress bars for the same thing. */
  var top=document.getElementById('stepCount');
  if(top) top.textContent=t('o.step',{n:4,t:ONB_TOTAL});
  var onb=document.getElementById('onbBar');
  if(onb) onb.style.width=Math.round((3+(i+1)/total)/ONB_TOTAL*100)+'%';
  /* One question at a time means the question should be the first thing on
     screen. The title and the "no right answers" note have done their job
     after question one. */
  var intro=document.getElementById('qzIntro');
  if(intro) intro.hidden = i>0;

  var tag=document.getElementById('qzDim');
  if(tag) tag.textContent=t(dimById(Q.dim).k);

  document.getElementById('qzQ').textContent=t(qk(quizBand(),Q.n,'q'));
  var box=document.getElementById('qzOpts');
  box.innerHTML=QLETTERS.map(function(L,ix){ return quizOptionRow(Q,L,ix); }).join('');
  box.querySelectorAll('[data-qa]').forEach(function(b){
    b.addEventListener('click',function(){ answerQuiz(b.dataset.qa); });
  });
  var prev=document.getElementById('qzPrev');
  if(prev) prev.style.visibility = i===0 ? 'hidden' : 'visible';
}
function answerQuiz(letter){
  var Q=QUESTIONS[S.quiz.i];
  S.quiz.answers[Q.n]=letter;
  S.quiz.band=quizBand();
  saveQuiz();
  if(S.quiz.i < QUESTIONS.length-1){
    S.quiz.i++;
    renderQuiz();
  } else {
    finishQuiz();
  }
}
function finishQuiz(){
  S.quiz.scores=scoreQuiz();
  S.quiz.done=true;
  S.quiz.band=quizBand();
  recordCheckin();
  applyProfileToPlan();
  saveQuiz();
  unlock('ach.quiz');
  if(document.getElementById('onboarding').style.display==='block'){
    showStep(5);
  } else {
    renderProfile('profBody');
    toast(t('rs.updated'));
  }
}
/* The check-in runs before onboarding finishes, i.e. before save() is allowed
   to write a profile, so its answers get their own key and are folded back in
   by load(). Losing ten answers to a mistimed refresh would be the one thing
   nobody would re-enter. */
function saveQuiz(){
  try{ localStorage.setItem('proactive_quiz', JSON.stringify(S.quiz)); }catch(e){}
}
function loadQuiz(){
  try{
    var raw=localStorage.getItem('proactive_quiz');
    if(raw){
      var q=JSON.parse(raw);
      if(q && q.answers){
        if(!q.band) q.band='a13';   // every save before bands existed was teen-worded
        S.quiz=q;
      }
    }
  }catch(e){}
  if(!S.quiz) S.quiz=emptyQuiz();
}
function restartQuiz(){
  S.quiz=emptyQuiz(); saveQuiz();
}

/* ================= check-in history =================
   A retake used to overwrite the result and the earlier one was simply gone,
   which threw away the only thing the app could ever show that really moves
   someone: proof they changed. Recorded for everybody - the chart that reads it
   may be a Pro view, but the data is the user's and is never not kept. */
function recordCheckin(){
  if(!S.hist) S.hist=[];
  var sc=S.quiz.scores||{};
  var last=S.hist[S.hist.length-1];
  var entry={d:dayKey(), band:S.quiz.band||'a13', s:{
    init:sc.init|0, goal:sc.goal|0, time:sc.time|0, solve:sc.solve|0, plan:sc.plan|0}};
  /* two goes at the same check-in on one day is one data point, the later one */
  if(last && last.d===entry.d) S.hist[S.hist.length-1]=entry;
  else S.hist.push(entry);
  if(S.hist.length>60) S.hist=S.hist.slice(-60);
  save();
}
function checkinAvg(e){
  var s=e.s; return Math.round((s.init+s.goal+s.time+s.solve+s.plan)/5);
}
function daysSinceCheckin(){
  if(!S.hist||!S.hist.length) return 0;
  return daysBetween(S.hist[S.hist.length-1].d, dayKey());
}

function meterRow(d){

/* compact:true is the dashboard version - the score and the five bars only.

/* One suggestion a day, drawn from the area the check-in flagged as weakest so
   the app leans where the user actually needs it. Without a profile it falls

function pickNextStep(){
  var day=dayKey();
  if(S.next && S.next.day===day) return S.next;
  var key, theme='';
  if(hasProfile()){
    var w=weakDim();
    var seed=Math.abs(hashDay(day)) % 3 + 1;
    key='rs.ac.'+w+'.'+seed;
    theme=t(dimById(w).k);
  } else {
    var c=CHALLENGES[Math.abs(hashDay(day)) % CHALLENGES.length];
    key=c.t; theme=t(c.th);
  }
  S.next={day:day, key:key, theme:theme, done:false};
  save();
  return S.next;
}
/* A tiny string hash so the suggestion is stable for a given day instead of
   changing on every repaint. */
function hashDay(s){
  var h=0;
  for(var i=0;i<s.length;i++){ h=(h*31 + s.charCodeAt(i))|0; }
  return h;
}

/* Local calendar day, not UTC - with UTC the day would roll over at the wrong
   hour and break every streak for anyone not on GMT. */
function dayKey(d){
  d = d || new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function daysBetween(a,b){
  return Math.round((new Date(b+'T00:00:00') - new Date(a+'T00:00:00'))/86400000);
}
/* Shared by the sport and skincare mini-apps: same day is a no-op, yesterday
   extends the run. One missed day is forgiven once per run - a month of work
   should not be wiped out by a single bad Tuesday, which is the moment most
   people stop opening the app for good. A second miss does reset it: a streak
   that can never break is not a streak. */
function bumpStreak(o,day){
  day = day || dayKey();
  if(o.lastDay === day) return o.streak;
  var gap = o.lastDay ? daysBetween(o.lastDay, day) : 0;
  if(!o.lastDay){ o.streak=1; o.grace=0; }
  else if(gap === 1){ o.streak=(o.streak||0)+1; }
  else if(gap === 2 && !o.grace){ o.streak=(o.streak||0)+1; o.grace=1; }
  else { o.streak=1; o.grace=0; }
  o.lastDay = day;
  return o.streak;
}
/* A run that was broken before today should read as 0, not as its stale value.
   A run with one day missed and the grace still unspent is not broken yet: act
   today and it carries on, so it keeps showing. */
function liveStreak(o){
  if(!o || !o.lastDay) return 0;
  var gap = daysBetween(o.lastDay, dayKey());
  if(gap === 0 || gap === 1) return o.streak||0;
  if(gap === 2 && !o.grace) return o.streak||0;
  return 0;
}
/* True while one missed day can still be rescued by acting today. */
function streakRescuable(o){
  if(!o || !o.lastDay || o.grace) return false;
  return daysBetween(o.lastDay, dayKey()) === 2;
}

var STORE_V=4;
/* The profile is written only once setup finishes. Anything that fires during
   onboarding - an achievement unlocking off the check-in, a tip - must not
   persist a half-built profile, or a refresh drops the user into the app with
   steps still unfinished. The look, the answers and the chain each have their
   own key and are unaffected. */
function save(){ try{
  if(onbActive) return;
  saveLook();
  if(GENDERS.indexOf(P.gender)>=0) localStorage.setItem('proactive_gender', P.gender);
  localStorage.setItem('proactive_v',STORE_V);
  localStorage.setItem('proactive_p',JSON.stringify(P));
  localStorage.setItem('proactive_s',JSON.stringify(S));
  localStorage.setItem('proactive_uid',uid);
}catch(e){ if(typeof warnQuota==='function') warnQuota(); } }

/* ids must never collide with ids already sitting in storage, whatever their
   origin - a stale counter silently makes one checkbox toggle another row. */
function reseedUid(){
  var max=0;
  function seen(n){ n=Number(n); if(n>max) max=n; }
  (S.tasks||[]).forEach(function(x){ seen(x.id); });
  (S.missions||[]).forEach(function(x){ seen(x.id); });
  (S.goals||[]).forEach(function(g){ seen(g.id); (g.actions||[]).forEach(function(a){ seen(a.id); }); });
  (P.customCats||[]).forEach(function(c){ var m=/^custom_(\d+)$/.exec(c.id||''); if(m) seen(m[1]); });
  var stored=Number(localStorage.getItem('proactive_uid'))||1;
  uid=Math.max(stored,max+1,1);
}

/* v1 stored every task, mission and category label as a hardcoded Hebrew
   string and category icons as emoji, so carrying that straight into the new
   build leaves Hebrew text in the other four languages and icon references
   that resolve to nothing. Keep the progress, rebuild the labelled parts. */
function migrateV1(){
  P.customCats=(P.customCats||[]).map(function(c){
    return {id:c.id, name:c.name, icon:'star', custom:true, sg:['sg.generic']};
  });
  P.easy=[]; P.hard=[];                 // v1 stored these as Hebrew literals
  S.tasks=[]; S.missions=[]; S.plan={}; // re-seeded below from the new schema
  S.goals=(S.goals||[]).map(function(g){
    return {id:g.id, title:g.title,     // the user typed these, so they stay
            actions:guessSteps(g.title).map(function(k){
              return {id:0,key:k,text:'',done:false};
            })};
  });
  if(!P.trialStart) P.trialStart=Date.now();
}

/* v2 predates the mini-apps. Additive only: nothing stored by v2 is touched. */
function migrateV2(){
  if(!S.mini) S.mini=emptyMini();
}

/* Fields the v4 schema adds. Object.assign in load() merges a stored save over
   the defaults, so a v3 save arrives with these already present (as defaults);
   this only backfills a save that was hand-edited or partially written. */
function ensureV4Fields(){
  if(!S.quiz) S.quiz=emptyQuiz();
  if(!S.lessons) S.lessons={};
  if(!S.ach) S.ach={};
  if(!S.tips) S.tips={};
  if(!S.hist) S.hist=[];
  if(S.mini && S.mini.skin && typeof migrateRoutine==='function') migrateRoutine(S.mini.skin);
  if(!S.day) S.day={streak:0,lastDay:null};
  if(!S.stats) S.stats={tasksDone:0, challenges:0, comebacks:0, bestStreak:0};
  /* Goals made before the start gate existed were tracked from the day they
     were written, so they count as started - anything else would silently
     stop a streak someone already has. */
  (S.goals||[]).forEach(function(g){ if(g.started===undefined){ g.started=true; g.startedAt=g.startedAt||null; } });
}

/* v3 predates the check-in, the lessons, the achievements and the real day
   streak. Additive only: nothing stored by v3 is touched. The old S.streak
   counted ticks rather than days, so it seeds stats.tasksDone - which is what
   it actually measured - and the day streak starts fresh instead of inheriting
   a number that never meant days. */
function migrateV3(){
  ensureV4Fields();
  S.stats.tasksDone = Number(S.streak)||0;
}

/* Every real action routes through here: it is the single place that decides
   the day streak, so nothing can bump it twice in one day and a missed day
   simply starts a new run instead of "failing". */
function markActiveToday(){
  if(!S.day) S.day={streak:0,lastDay:null};
  var day=dayKey();
  if(S.day.lastDay===day) return;
  var gap = S.day.lastDay ? daysBetween(S.day.lastDay,day) : 0;
  var broke = S.day.lastDay && (gap>2 || (gap===2 && S.day.grace));
  bumpStreak(S.day,day);
  if(broke) S.stats.comebacks=(S.stats.comebacks||0)+1;
  S.stats.bestStreak=Math.max(S.stats.bestStreak||0, S.day.streak||0);
  save();
  if((S.day.streak||0)>=3 && typeof tip==='function') tip('streak');
}
function shownStreak(){ return liveStreak(S.day); }
function streakLine(){
  var n=shownStreak();
  if(streakRescuable(S.day)) return t('d.sk.rescue',{n:n});
  if(n<=0 && S.day && S.day.lastDay) return t('d.sk.miss');
  return n<=0 ? t('d.sk.0') : n===1 ? t('d.sk.1') : t('d.sk.n',{n:n});
}

function load(){ try{
  var p=localStorage.getItem('proactive_p'), s=localStorage.getItem('proactive_s');
  if(!p||!s) return false;
  var pp=JSON.parse(p);
  /* A profile written before Pro existed has no `founder` field at all. Those
     people were promised a free app and got one, so they keep every feature for
     good - checked before the merge, because the default would mask it. */
  var grandfather = !('founder' in pp);
  P=Object.assign(P,pp); S=Object.assign(S,JSON.parse(s));
  if(grandfather) P.founder=true;
  reseedUid();                          // before anything hands out a new id
  var v=Number(localStorage.getItem('proactive_v'))||1;
  if(v<2){
    migrateV1();
    buildCats();
    seedTasks(); seedMissions();        // rebuilt in the new shape; goals kept
    S.goals.forEach(function(g){
      g.id=uid++; g.actions.forEach(function(a){ a.id=uid++; });
    });
  }
  if(v<3) migrateV2();                  // chains, so a v1 save lands on v4
  if(v<4) migrateV3();
  if(!S.mini) S.mini=emptyMini();       // belt and braces for a hand-edited save
  ensureV4Fields();
  loadQuiz();                           // answers saved before onboarding ended
  if(v<STORE_V) save();
  return true;
}catch(e){ return false; } }

  if(!CATS.length) CATS = ALL_CATS.slice();
}

/* The strip tells the truth about the account and nothing else. With no
   checkout configured there is no trial to count down, so it stays away rather
   than inventing a deadline nobody can act on. */
function renderTrial(){
  var bar=document.getElementById('trialBar');
  var st=(typeof proState==='function') ? proState() : 'open';
  if(st==='open'||st==='founder'||st==='pro'){ bar.classList.remove('on'); return; }

/* ================= billing =================
   One block to configure. Paste the Payment Link for each plan and, if the
   provider issues licence keys, the app can verify a subscription for real -
   see PAYMENTS.md at the repository root.

   While `checkout` is empty the app runs in OPEN mode: nothing is locked, no
   upsell appears anywhere, and the pricing section says plainly that payment is
   not open yet. Gating a feature when nobody can possibly pay would just be
   taking the app away from people. */
var BILLING={
  provider:'lemonsqueezy',
  checkout:{monthly:'', annual:''},
  portal:''                              /* "manage my subscription" page */
};
var GOAL_FREE_MAX=3;                     /* active targets on the free tier */
/* The one address on the site. Until checkout is configured this is how someone
   who wants to pay actually reaches you; after it, it is where questions go. */
var CONTACT_EMAIL='ben.mor.04.2012@gmail.com';

function billingOn(){ return !!(BILLING.checkout.monthly||BILLING.checkout.annual); }

/* ================= licence =================
   Lemon Squeezy's License API takes no secret key and answers CORS, so a page
   with no server behind it can still ask the provider whether a subscription is
   really live. That is the whole reason this is a licence key and not a
   "?paid=1" flag in the URL: one can be checked, the other cannot. */
var LIC={key:'', inst:'', ok:false, exp:null, checked:0};

function loadLic(){
  try{
    var raw=localStorage.getItem('proactive_lic');
    if(raw){ var j=JSON.parse(raw); if(j&&typeof j==='object') LIC=Object.assign(LIC,j); }
  }catch(e){}
}
function saveLic(){ try{ localStorage.setItem('proactive_lic', JSON.stringify(LIC)); }catch(e){} }

function licExpired(){
  if(!LIC.exp) return false;
  var t0=Date.parse(LIC.exp);
  return !isNaN(t0) && Date.now()>t0;
}
/* Verified once, then trusted offline until it expires - an app that stops
   working on a train is worse than one that trusts a paying customer. */
function licActive(){ return !!(LIC.ok && LIC.key && !licExpired()); }

function lsPost(op, data){
  var body=Object.keys(data).filter(function(k){ return data[k]; })
    .map(function(k){ return encodeURIComponent(k)+'='+encodeURIComponent(data[k]); }).join('&');
  return fetch('https://api.lemonsqueezy.com/v1/licenses/'+op, {
    method:'POST',
    headers:{'Accept':'application/json','Content-Type':'application/x-www-form-urlencoded'},
    body:body
  }).then(function(r){ return r.json(); });
}
/* Every provider answers in its own shape; everything above this line speaks
   one shape. Swapping to Paddle or Stripe later is another adapter, not a
   rewrite of the app. */
var LICENSE_ADAPTERS={
  lemonsqueezy:{
    activate:  function(key,name){ return lsPost('activate',  {license_key:key, instance_name:name}); },
    validate:  function(key,inst){ return lsPost('validate',  {license_key:key, instance_id:inst}); },
    deactivate:function(key,inst){ return lsPost('deactivate',{license_key:key, instance_id:inst}); },
    norm: function(j){
      var lk=(j&&j.license_key)||{};
      var live = lk.status ? (lk.status==='active') : true;
      return {
        ok:  !!(j && (j.activated || j.valid || j.deactivated) && live),
        exp: lk.expires_at || null,
        inst:(j && j.instance && j.instance.id) || '',
        err: (j && j.error) || null
      };
    }
  }
};
function licAdapter(){ return LICENSE_ADAPTERS[BILLING.provider] || LICENSE_ADAPTERS.lemonsqueezy; }
function deviceName(){
  var n=(P.name||'').trim();
  return (n? n+' · ':'')+'proactivity-'+(navigator.platform||'web');
}

function activateLicense(key){
  var a=licAdapter();
  return a.activate(String(key||'').trim(), deviceName()).then(function(j){
    var r=a.norm(j);
    if(!r.ok) return {ok:false, err:r.err||t('pro.lic.bad')};
    LIC={key:String(key).trim(), inst:r.inst, ok:true, exp:r.exp, checked:Date.now()};
    saveLic(); return {ok:true};
  }).catch(function(){ return {ok:false, err:t('pro.lic.net')}; });
}
function releaseLicense(){
  var a=licAdapter(), key=LIC.key, inst=LIC.inst;
  LIC={key:'', inst:'', ok:false, exp:null, checked:0}; saveLic();
  if(key&&inst) { try{ a.deactivate(key,inst).catch(function(){}); }catch(e){} }
}
/* A dead network is not a verdict: only the provider actually saying "no"
   revokes access. */
var LIC_RECHECK_MS=7*86400000;
function revalidateLicense(){
  if(!billingOn() || !LIC.key || !LIC.ok) return;
  if(Date.now()-(LIC.checked||0) < LIC_RECHECK_MS) return;
  var a=licAdapter();
  a.validate(LIC.key, LIC.inst).then(function(j){
    var r=a.norm(j);
    LIC.checked=Date.now();
    if(r.exp) LIC.exp=r.exp;
    if(!r.ok){ LIC.ok=false; }
    saveLic();
    if(!r.ok && typeof redrawAll==='function') redrawAll();
  }).catch(function(){});
}

/* ================= backup =================
   Everything this app knows lives in localStorage on one device. One "clear
   browsing data" and months of streak are gone with no way back, so export and
   import are free for everyone, forever - charging someone for their own data
   back is not a business model. */
var STORE_KEYS=['proactive_v','proactive_p','proactive_s','proactive_uid',
                'proactive_lang','proactive_gender','proactive_accent',
                'proactive_theme','proactive_quiz','proactive_chain','proactive_tab'];

function exportBundle(){
  var out={app:'proactivity', v:STORE_V, at:new Date().toISOString(), keys:{}};
  STORE_KEYS.forEach(function(k){
    try{ var v=localStorage.getItem(k); if(v!==null) out.keys[k]=v; }catch(e){}
  });
  return out;
}
function downloadJSON(obj, name){
  var blob=new Blob([JSON.stringify(obj,null,1)],{type:'application/json'});
  var url=URL.createObjectURL(blob), a=document.createElement('a');
  a.href=url; a.download=name; document.body.appendChild(a); a.click();
  setTimeout(function(){ URL.revokeObjectURL(url); a.remove(); },0);
}
function doExport(){
  var d=new Date(), pad=function(n){ return (n<10?'0':'')+n; };
  downloadJSON(exportBundle(), 'proactivity-'+d.getFullYear()+pad(d.getMonth()+1)+pad(d.getDate())+'.json');
  if(typeof toast==='function') toast(t('bk.done'));
}

/* A restore overwrites everything, so it says out loud what it is about to
   write before it writes it. */
function bundleSummary(b){
  var p={}, s={};
  try{ p=JSON.parse(b.keys['proactive_p']||'{}'); }catch(e){}
  try{ s=JSON.parse(b.keys['proactive_s']||'{}'); }catch(e){}
  return {
    name: p.name||'',
    points: Number(s.points)||0,
    streak: (s.day&&Number(s.day.streak))||0,
    goals: (s.goals||[]).length,
    at: b.at||''
  };
}
function applyBundle(b){
  STORE_KEYS.forEach(function(k){ try{ localStorage.removeItem(k); }catch(e){} });
  Object.keys(b.keys||{}).forEach(function(k){

/* ================= calendar =================
   No server means no push notification. A calendar file needs no server, works
   on every phone, and puts the target where the user already looks. */
function icsEscape(s){ return String(s).replace(/([,;\\])/g,'\\$1').replace(/\n/g,'\\n'); }
function icsStamp(d){
  function p(n){ return (n<10?'0':'')+n; }
  return d.getUTCFullYear()+p(d.getUTCMonth()+1)+p(d.getUTCDate())+'T'+
         p(d.getUTCHours())+p(d.getUTCMinutes())+'00Z';
}
var ICS_DAYS=['SU','MO','TU','WE','TH','FR','SA'];
/* freq times a week, spread out rather than stacked on consecutive days. */
function spreadDays(startIdx, n){
  n=Math.max(1,Math.min(7,n|0));
  var step=7/n, out=[];
  for(var i=0;i<n;i++) out.push(ICS_DAYS[(startIdx+Math.round(i*step))%7]);
  return out.filter(function(d,i,a){ return a.indexOf(d)===i; });
}
function goalICS(g, hour, minute){
  var start=new Date();
  start.setHours(hour, minute, 0, 0);
  if(start<new Date()) start.setDate(start.getDate()+1);
  var end=new Date(start.getTime()+30*60000);
  var freq=Number(g.freq)||3;
  var title=g.title||t('g.one');
  var body=[g.week||'', g.today||'', g.now||''].filter(Boolean).join('\n');
  return [
    'BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Proactivity//HE','CALSCALE:GREGORIAN',
    'BEGIN:VEVENT',
    'UID:proactivity-'+(g.id||0)+'-'+Date.now()+'@proactivity',
    'DTSTAMP:'+icsStamp(new Date()),
    'DTSTART:'+icsStamp(start),
    'DTEND:'+icsStamp(end),
    'RRULE:FREQ=WEEKLY;BYDAY='+spreadDays(start.getDay(), freq).join(','),
    'SUMMARY:'+icsEscape(title),
    'DESCRIPTION:'+icsEscape(body),
    'BEGIN:VALARM','TRIGGER:-PT30M','ACTION:DISPLAY','DESCRIPTION:'+icsEscape(title),'END:VALARM',
    'END:VEVENT','END:VCALENDAR'
  ].join('\r\n');
}
function downloadICS(g){
  var parts=String(P.remind||'17:00').split(':');
  var text=goalICS(g, Number(parts[0])||17, Number(parts[1])||0);
  var blob=new Blob([text],{type:'text/calendar;charset=utf-8'});
  var url=URL.createObjectURL(blob), a=document.createElement('a');
  a.href=url; a.download='proactivity.ics'; document.body.appendChild(a); a.click();
  setTimeout(function(){ URL.revokeObjectURL(url); a.remove(); },0);
  if(typeof toast==='function') toast(t('cal.done'));
}

var CH=null;
function emptyChain(){ return {step:0, area:null, kind:null, kindText:'', freq:null, obst:null}; }
function saveChain(){ try{ localStorage.setItem('proactive_chain', JSON.stringify(CH)); }catch(e){} }

  try{ var raw=localStorage.getItem('proactive_chain'); if(raw){ var c=JSON.parse(raw); if(c && typeof c.step==='number') CH=c; } }catch(e){}
  if(!CH) CH=emptyChain();

function kindLabel(){
  if(!CH) return '';

}

function chainWeek(){  return t('gw.line',{freq:t('gf.'+(CH.freq||3)), kind:kindLabel()}); }
function chainToday(){ return t('gd.'+(CH.area||'goals'),{kind:kindLabel()}); }
function chainNow(){   return t('gn.'+(CH.obst||'other')); }

/* A goal built here carries where it came from, so the ladder can be
   regenerated in another language and the weekly mission knows its area. */
function goalFromChain(){
  var g=newGoal(chainTitle());
  g.area=CH.area; g.kind=CH.kind; g.kindText=CH.kindText; g.freq=CH.freq||3; g.obst=CH.obst;
  g.week=chainWeek(); g.today=chainToday(); g.now=chainNow();
  g.actions=[
    {id:uid++, key:null, text:chainNow(),   done:false},
    {id:uid++, key:null, text:chainToday(), done:false},
    {id:uid++, key:null, text:chainWeek(),  done:false}

}

function bindChain(host){
  host.querySelectorAll('[data-ch-back]').forEach(function(b){
    b.addEventListener('click',function(){ CH.step=Math.max(0,CH.step-1); saveChain(); renderChain(); });
  });
  host.querySelectorAll('[data-area]').forEach(function(b){
    b.addEventListener('click',function(){
      if(CH.area!==b.dataset.area){ CH.kind=null; CH.kindText=''; }
      CH.area=b.dataset.area; CH.step=1; saveChain(); renderChain();
    });
  });
  host.querySelectorAll('[data-kind]').forEach(function(b){
    b.addEventListener('click',function(){
      CH.kind=b.dataset.kind; saveChain();
      if(CH.kind==='other'){ renderChain(); var inp=document.getElementById('chKindText'); if(inp) inp.focus(); return; }
      CH.step=2; saveChain(); renderChain();
    });
  });
  var kt=host.querySelector('#chKindText');
  if(kt){
    kt.addEventListener('input',function(){ CH.kindText=kt.value; saveChain();
      var nx=host.querySelector('[data-ch-next]'); if(nx) nx.disabled=!kt.value.trim(); });
    kt.addEventListener('keydown',function(e){ if(e.key==='Enter' && kt.value.trim()){ e.preventDefault(); CH.step=2; saveChain(); renderChain(); } });
  }
  host.querySelectorAll('[data-ch-next]').forEach(function(b){
    b.addEventListener('click',function(){
      if(CH.kind==='other' && !(CH.kindText||'').trim()) return;
      CH.step=Math.min(4,CH.step+1); saveChain(); renderChain();
    });
  });
  host.querySelectorAll('[data-freq]').forEach(function(b){
    b.addEventListener('click',function(){ CH.freq=Number(b.dataset.freq); CH.step=3; saveChain(); renderChain(); });
  });
  host.querySelectorAll('[data-obst]').forEach(function(b){
    b.addEventListener('click',function(){ CH.obst=b.dataset.obst; CH.step=4; saveChain(); renderChain(); });
  });
  host.querySelectorAll('[data-ch-save]').forEach(function(b){
    b.addEventListener('click',function(){ commitChain(false); });
  });
  host.querySelectorAll('[data-ch-start]').forEach(function(b){
    b.addEventListener('click',function(){ commitChain(true); });
  });
  host.querySelectorAll('[data-ch-plan]').forEach(function(b){
    b.addEventListener('click',function(){ openPlanFor(CH.area); });
  });
}

/* The one exit from the chain. During onboarding the goal is parked on the
   profile and seeded when setup finishes; in the app it is added directly. */
function commitChain(start){
  var g=goalFromChain();
  var dup=(S.goals||[]).some(function(x){ return x.title===g.title; });
  if(dup && !onbActive){ toast(t('gc.dup')); return; }
  /* The first target of a new account is written during onboarding, before any
     limit could sensibly apply, so the gate is only outside it. */
  if(!onbActive && goalLimitReached()){ toast(t('pro.goalmax',{n:GOAL_FREE_MAX})); openPlans(); return; }
  if(onbActive){
    P.chainGoal={goal:g, start:!!start};
    resetChain();
    showStep(7);
    return;
  }
  S.goals.unshift(g);
  if(start) startGoal(g); else { save(); tip('goal.new'); }
  resetChain();
  var host=document.getElementById('goalChain'); if(host){ host.innerHTML=''; host.hidden=true; }
  var nb=document.getElementById('newGoalBtn'); if(nb) nb.hidden=false;
  renderGoals(); renderDash(); checkAchievements();
}

/* Sport already has an age-adapted training plan in the Body tab; every other
   area has a lesson that fits. Neither is invented for this - they are the
   parts of the app that were already there. */

  var a=areaById(area);
  if(!a) return;
  if(onbActive){ P.planAfter=area; toast(t('gl.saved')); return; }
  if(!a.lesson){ goPage('body'); showMini('sport'); return; }
  goPage('learn');

  if(d){ d.open=true; d.scrollIntoView({block:'start'}); }
}

/* ================= starting a target ================= */
/* Creating a target changes nothing. THIS is what starts the counters: the
   goal is marked started, its weekly mission appears on the grid with the
   frequency the user chose, and only now does the day count. */
function startGoal(g){
  if(!g || g.started) return;
  g.started=true; g.startedAt=dayKey();
  var a=areaById(g.area);
  var target=Math.min(7,Math.max(1, g.freq===5 ? 6 : (g.freq||3)));
  S.missions.push({id:uid++, catId:a?a.cat:'hobby', titleKey:null, title:g.title,
                   target:target, goalId:g.id,
                   days:[false,false,false,false,false,false,false]});
  markActiveToday();
  save();
  toast(t('gc.started.t'));
  tip('goal.start');
  renderGoals(); renderWeek(); renderDash(); checkAchievements();
}
